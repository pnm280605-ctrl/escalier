 const q=GM.qs[GM.i];if(!q)return raceEnd();
 const t0=Date.now();GM.t0=t0;GM.locked=false;
 $("#overlay").innerHTML=`${gameTop("Course contre la montre",`<span class="tnum muted">${GM.i+1}/${GM.qs.length}</span>`)}<div class="ov-body"><div class="ov-inner race"><div class="race-bar"><i id="race-t"></i></div><div class="race-q fr">${qStem(q)}</div><div class="race-grid">${q.opts.map((o,i)=>`<button class="race-opt c${i}" data-i="${i}"><span class="shp">${SHAPES[i]}</span><span class="fr">${esc(o)}</span></button>`).join("")}</div><div class="race-score tnum">Score : <b>${GM.score}</b>${GM.streak>1?` · Série 🔥 ${GM.streak}`:""}</div></div></div>`;
 gameClose();
 const bar=$("#race-t");
 OVT.push(setInterval(()=>{const el=(Date.now()-t0)/1000,left=Math.max(0,GM.lim-el);if(bar)bar.style.width=(left/GM.lim*100)+"%";if(left<=0)raceAnswer(-1);},100));
 $$(".race-opt").forEach(b=>b.onclick=()=>raceAnswer(+b.dataset.i));
}
function raceAnswer(i){
 if(GM.locked)return;GM.locked=true;OVT.forEach(clearInterval);OVT=[];
 const q=GM.qs[GM.i],el=Math.min(GM.lim,(Date.now()-GM.t0)/1000),ok=i===q.ans;
 let pts=0;if(ok){GM.streak++;pts=Math.round(1000*(1-el/GM.lim/2))+Math.min(500,(GM.streak-1)*100);}else GM.streak=0;
 GM.score+=pts;
 GM.rivals.forEach(r=>{if(Math.random()<r.p)r.s+=Math.round(1000*(1-(2+Math.random()*12)/GM.lim/2));});
 $$(".race-opt").forEach(b=>{const k=+b.dataset.i;b.disabled=true;if(k===q.ans)b.classList.add("right");else b.classList.add("dim");});
 const board=[{n:"Vous",s:GM.score,me:true},...GM.rivals].sort((a,b)=>b.s-a.s);
 const rank=board.findIndex(x=>x.me)+1;
 const box=document.createElement("div");box.className="race-res "+(ok?"ok":"bad");
 box.innerHTML=`<b>${ok?"Correct ! +"+pts:i<0?"Temps écoulé !":"Incorrect"}</b>${!ok?`<span class="fr">Réponse : ${esc(q.opts[q.ans])}</span>`:""}${q.ex&&!ok?`<span class="muted">${esc(q.ex)}</span>`:""}<ol class="board">${board.map(x=>`<li class="${x.me?"me":""}"><span>${esc(x.n)}</span><b class="tnum">${x.s}</b></li>`).join("")}</ol><button class="btn" id="race-next">${GM.i<GM.qs.length-1?"Question suivante":"Voir le podium"}</button>`;
 $(".race").appendChild(box);GM.rank=rank;
 $("#race-next").onclick=()=>{GM.i++;raceQ();};$("#race-next").focus();
}
function raceEnd(){
 const board=[{n:"Vous",s:GM.score,me:true},...GM.rivals].sort((a,b)=>b.s-a.s),rank=board.findIndex(x=>x.me)+1;
 gameEnd("race","Course contre la montre",GM.score,`Classement : <b>${rank}${rank===1?"er":"e"}</b> sur 5 ${rank===1?"🏆":""}<br><span class="muted">${board.slice(0,3).map((x,i)=>["🥇","🥈","🥉"][i]+" "+esc(x.n)+" "+x.s).join(" · ")}</span>`);
}

/* 2. Lật thẻ ghép cặp */
function pairsStart(lv){
 const ws=gameWords(lv,8);const cards=shuffle(ws.flatMap((w,k)=>[{k,txt:w.fd,fr:true,w},{k,txt:w.vi,fr:false,w}]));
 GM={id:"pairs",cards,open:[],done:new Set(),moves:0,t0:Date.now(),lock:false};pairsDraw();
}
function pairsDraw(){
 $("#overlay").innerHTML=`${gameTop("Paires",`<span class="tnum muted">Coups : ${GM.moves}</span>`)}<div class="ov-body"><div class="ov-inner"><p class="muted" style="margin:0 0 12px">Retournez deux cartes : un mot français et sa traduction.</p><div class="pairs">${GM.cards.map((c,i)=>{const up=GM.open.includes(i)||GM.done.has(c.k);return `<button class="pcard ${up?"up":""} ${GM.done.has(c.k)?"ok":""} ${c.fr?"fr":""}" data-i="${i}" ${GM.done.has(c.k)?"disabled":""}>${up?esc(c.txt):"?"}</button>`;}).join("")}</div></div></div>`;
 gameClose();
 $$(".pcard").forEach(b=>b.onclick=()=>{
  if(GM.lock)return;const i=+b.dataset.i,c=GM.cards[i];if(GM.open.includes(i)||GM.done.has(c.k))return;
  GM.open.push(i);if(c.fr)speak(vFrPlain(c.w.fr));
  if(GM.open.length===2){GM.moves++;const [a,b2]=GM.open.map(x=>GM.cards[x]);
   if(a.k===b2.k&&a.fr!==b2.fr){GM.done.add(a.k);GM.open=[];pairsDraw();if(GM.done.size===GM.cards.length/2){const secs=Math.round((Date.now()-GM.t0)/1000);setTimeout(()=>gameEnd("pairs","Paires",GM.moves,`${GM.moves} coups · ${fmtTime(secs)}<br><span class="muted">Moins de coups = meilleur score.</span>`,false),500);}return;}
   pairsDraw();GM.lock=true;setTimeout(()=>{GM.open=[];GM.lock=false;pairsDraw();},900);return;}
  pairsDraw();
 });
}

/* 3. Sắp chữ cái */
function scrStart(lv){
 let ws=gameWords(lv,40).map(w=>({w,word:vFrPlain(w.fr).replace(/^(le|la|les|un|une|l')\s*/i,"")})).filter(x=>/^[a-zàâçéèêëîïôûùüÿœæ'-]{4,10}$/i.test(x.word));
 ws=ws.slice(0,8);if(ws.length<4){toast("Chưa đủ từ cho trò này ở trình độ "+lv+".");closeOverlay();return;}
 GM={id:"scramble",ws,i:0,score:0,picked:[]};scrRound();
}
function scrRound(){
 const x=GM.ws[GM.i];if(!x)return gameEnd("scramble","Mots mélangés",GM.score,`${GM.score} / ${GM.ws.length} mots trouvés`);
 if(!x.tiles){let t;do{t=shuffle(x.word.split(""));}while(t.join("")===x.word&&x.word.length>1);x.tiles=t.map(ch=>({ch,used:false}));}
 const g=vGender(x.w);
 $("#overlay").innerHTML=`${gameTop("Mots mélangés",`<span class="tnum muted">${GM.i+1}/${GM.ws.length}</span>`)}<div class="ov-body"><div class="ov-inner"><div class="q-sub">Indice</div><h2 class="q-title">${esc(x.w.vi)} ${g?`<span class="gtag g-${g[0]}">${g[1]}</span>`:""}</h2><div class="scr-line fr">${x.word.split("").map((_,k)=>`<span class="slot">${GM.picked[k]!=null?esc(x.tiles[GM.picked[k]].ch):""}</span>`).join("")}</div><div class="bank">${x.tiles.map((t,k)=>`<button class="tile fr ${t.used?"ghost":""}" data-k="${k}" ${t.used?"disabled":""}>${esc(t.ch)}</button>`).join("")}</div></div></div><div class="ov-foot"><div class="in"><button class="btn ghost" id="scr-undo">Effacer</button><button class="btn ghost" id="scr-skip">Passer</button></div></div>`;
 gameClose();
 $$(".tile[data-k]").forEach(b=>b.onclick=()=>{const k=+b.dataset.k;x.tiles[k].used=true;GM.picked.push(k);
  if(GM.picked.length===x.word.length){const guess=GM.picked.map(i=>x.tiles[i].ch).join("");const ok=guess.toLowerCase()===x.word.toLowerCase();if(ok)GM.score++;speak(vFrPlain(x.w.fr));scrRound();const line=$(".scr-line");line.classList.add(ok?"ok":"bad");toast(ok?"Bravo ! « "+x.word+" »":"La réponse était « "+x.word+" »");setTimeout(()=>{GM.i++;GM.picked=[];scrRound();},1100);return;}
  scrRound();});
 $("#scr-undo").onclick=()=>{x.tiles.forEach(t=>t.used=false);GM.picked=[];scrRound();};
 $("#scr-skip").onclick=()=>{toast("La réponse était « "+x.word+" »");GM.i++;GM.picked=[];scrRound();};
}

/* 4. Đúng hay sai 60 giây */
function tfStart(lv){
 const ws=gameWords(lv,60);GM={id:"tf",ws,score:0,n:0,t0:Date.now(),lim:60,cur:null,combo:0};tfNext();
 OVT.push(setInterval(()=>{const left=Math.max(0,GM.lim-(Date.now()-GM.t0)/1000);const e=$("#tf-t");if(e)e.textContent=Math.ceil(left);if(left<=0){OVT.forEach(clearInterval);OVT=[];gameEnd("tf","Vrai ou faux express",GM.score,`${GM.score} bonnes réponses sur ${GM.n}`);}},200));
}
function tfNext(){
 const w=GM.ws[GM.n%GM.ws.length],truth=Math.random()<.5;let shown=w.vi;
 if(!truth){const o=GM.ws.filter(x=>x!==w&&x.vi!==w.vi);shown=o.length?o[Math.floor(Math.random()*o.length)].vi:w.vi;}
 GM.cur={w,truth:truth||shown===w.vi};
 $("#overlay").innerHTML=`${gameTop("Vrai ou faux express",`<span class="timer">${icon("clock")}<span id="tf-t" class="tnum">${Math.ceil(Math.max(0,GM.lim-(Date.now()-GM.t0)/1000))}</span></span>`)}<div class="ov-body"><div class="ov-inner tf"><div class="tf-card"><div class="fr tf-fr">${esc(w.fd)}</div><div class="tf-eq">=</div><div class="tf-vi">${esc(shown)}</div></div><div class="tf-btns"><button class="btn red" id="tf-no">✗ Faux</button><button class="btn green" id="tf-yes">✓ Vrai</button></div><p class="muted tnum" style="text-align:center">Score : <b>${GM.score}</b>${GM.combo>2?` · Combo ${GM.combo}`:""} · Touches ← →</p></div></div>`;
 gameClose();
 const ans=v=>{const ok=v===GM.cur.truth;GM.n++;if(ok){GM.score++;GM.combo++;}else{GM.combo=0;toast("« "+GM.cur.w.fd+" » = "+GM.cur.w.vi);}tfNext();};
 $("#tf-yes").onclick=()=>ans(true);$("#tf-no").onclick=()=>ans(false);
 GM.key=e=>{if(!GM||GM.id!=="tf")return;if(e.key==="ArrowRight")ans(true);if(e.key==="ArrowLeft")ans(false);};
}
document.addEventListener("keydown",e=>{if(GM&&GM.key&&!$("#overlay").hidden)GM.key(e);});

/* 5. Đấu với mèo Minou */
function duelStart(lv){GM={id:"duel",qs:gameQuestions(lv,10),i:0,me:0,cat:0,p:Math.max(.45,.8-LEVELS.indexOf(lv)*.05)};duelQ();}
function duelQ(){
 OVT.forEach(clearInterval);OVT=[];
 const q=GM.qs[GM.i];if(!q){const res=GM.me>GM.cat?"Vous avez battu Minou ! 🏆":GM.me===GM.cat?"Égalité avec Minou !":"Minou a gagné cette fois… Revanche ?";return gameEnd("duel","Duel contre Minou",GM.me,`${res}<br><span class="muted">Vous ${GM.me} – ${GM.cat} Minou</span>`);}
 const catT=2+Math.random()*7,catOk=Math.random()<GM.p,catPick=catOk?q.ans:(q.ans+1+Math.floor(Math.random()*(q.opts.length-1)))%q.opts.length;
 GM.cq={catT,catPick,t0:Date.now(),done:false,catDone:false};
 $("#overlay").innerHTML=`${gameTop("Duel contre Minou",`<span class="tnum muted">${GM.i+1}/${GM.qs.length}</span>`)}<div class="ov-body"><div class="ov-inner"><div class="duel-score"><div><b>Vous</b><span class="tnum">${GM.me}</span></div><div class="duel-cat">${mascot(54)}<b>Minou</b><span class="tnum">${GM.cat}</span><em id="cat-st">réfléchit…</em></div></div><h2 class="q-title fr">${qStem(q)}</h2><div class="opts">${q.opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="k">${i+1}</span><span class="fr">${esc(o)}</span></button>`).join("")}</div><div id="duel-res"></div></div></div>`;
 gameClose();
 OVT.push(setInterval(()=>{if(!GM.cq.catDone&&(Date.now()-GM.cq.t0)/1000>=GM.cq.catT){GM.cq.catDone=true;const e=$("#cat-st");if(e)e.textContent="a répondu !";}},200));
 $$(".opt[data-i]").forEach(b=>b.onclick=()=>{
  if(GM.cq.done)return;GM.cq.done=true;OVT.forEach(clearInterval);OVT=[];
  const i=+b.dataset.i,el=(Date.now()-GM.cq.t0)/1000,ok=i===q.ans,catOk2=GM.cq.catPick===q.ans,catFaster=GM.cq.catT<el;
  if(ok)GM.me++;if(catOk2)GM.cat++;if(ok&&catOk2){if(catFaster)GM.cat++;else GM.me++;}
  $$(".opt[data-i]").forEach(x=>{const k=+x.dataset.i;x.disabled=true;if(k===q.ans)x.classList.add("right");else if(k===i)x.classList.add("wrong");});
  $("#duel-res").innerHTML=`<div class="race-res ${ok?"ok":"bad"}"><b>${ok?"Correct !":"Incorrect"} · Minou a choisi « ${esc(q.opts[GM.cq.catPick])} » ${catOk2?"(correct)":"(faux)"}</b>${ok&&catOk2?`<span>${catFaster?"Minou a été plus rapide : +1 bonus pour Minou":"Vous avez été plus rapide : +1 bonus !"}</span>`:""}${!ok&&q.ex?`<span class="muted">${esc(q.ex)}</span>`:""}<button class="btn" id="duel-next">${GM.i<GM.qs.length-1?"Question suivante":"Résultat"}</button></div>`;
  $("#duel-next").onclick=()=>{GM.i++;duelQ();};
 });
}
/* ===== Khởi động ===== */
renderAll();
if(!P.onboarded)welcome();else setTimeout(dailyNag,600);
if(CL)initSync().then(()=>setTimeout(dailyNag,300));
if(STANDALONE)fbInit();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
