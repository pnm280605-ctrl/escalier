const LESSON_FR={
"Động từ -ir, -oir, -re":["Les verbes en -ir, -oir, -re","2e groupe (-ir avec -iss-) : finir → nous fin<b>iss</b>ons.<br>3e groupe, à apprendre par cœur : venir, prendre, mettre, boire, voir, recevoir, savoir, connaître, vivre, courir…"],
"Thể khẳng định và phủ định":["L'impératif affirmatif et négatif","Trois personnes seulement (tu, nous, vous), sans sujet. Les verbes en -er perdent le <b>-s</b> à la 2e personne : Parle ! Va !<br>Irréguliers : être → sois, soyons, soyez · avoir → aie, ayons, ayez · savoir → sache…<br>Négation : <b>Ne</b> parle <b>pas</b> !"],
"Imparfait và passé composé":["Imparfait et passé composé","<b>Imparfait</b> : décor, état, habitude, action en cours. <b>Passé composé</b> : événement ponctuel, succession d'actions, action qui interrompt."],
"Dùng tương lai gần hay tương lai đơn":["Futur proche ou futur simple ?","<b>Futur proche</b> : action imminente, liée au présent.<br><b>Futur simple</b> : plus lointain, prédiction, promesse ; après <b>quand</b> à valeur future : Quand je <b>serai</b> grand…<br><b>si</b> + présent → futur simple : S'il pleut, je <b>resterai</b>."],
"Luyện thêm: kể chuyện":["Entraînement : raconter","<b>Plus-que-parfait</b> = avoir/être à l'imparfait + participe passé : action antérieure à une autre action passée.<br>Avec avoir, le participe s'accorde avec le COD <b>placé avant</b> : les lettres qu'il a écrit<b>es</b>.<br>Discours rapporté au passé : il a dit qu'il <b>était</b> fatigué."],
"Danh từ giống đực đuôi -ée và động từ porter":["Les noms masculins en -ée et le verbe porter","La plupart des noms en -ée sont féminins, mais quelques-uns sont masculins : <b>le musée, le lycée, le trophée, le scarabée</b>.<br>porter (avoir sur soi, transporter), apporter (amener vers ici), emporter (prendre avec soi en partant)."],
"Cách chia subjonctif hiện tại":["La formation du subjonctif présent","Radical de <b>ils</b> au présent + <b>-e, -es, -e, -ions, -iez, -ent</b> (ils finissent → que je finisse).<br>Irréguliers : être (que je sois), avoir (que j'aie), aller (que j'aille), faire (que je fasse), pouvoir (que je puisse), savoir (que je sache), vouloir (que je veuille)."],
"Khi nào dùng subjonctif":["Quand employer le subjonctif ?","Après <b>il faut que</b>, <b>vouloir que</b>, <b>souhaiter que</b>, <b>aimer que</b>, les sentiments (<b>être content / triste que</b>), <b>avant que, pour que, bien que</b>.<br>Même sujet → infinitif : Je veux <b>partir</b> (et non : je veux que je parte)."],
"Tính từ bất định":["Les adjectifs indéfinis","<b>chaque</b> (singulier) · <b>tout / toute / tous / toutes</b> + déterminant · <b>quelques</b> · <b>plusieurs</b> · <b>certain(e)s</b> · <b>aucun(e)</b> · <b>même</b> · <b>autre</b>."],
"Đại từ bất định":["Les pronoms indéfinis","<b>chacun(e)</b>, <b>quelqu'un</b>, <b>quelque chose</b>, <b>tout</b>, <b>tous / toutes</b> (on prononce le s), <b>certains</b>, <b>plusieurs</b>, <b>aucun(e)</b>, <b>n'importe qui / quoi / où</b>."],
"Động từ jouer và prendre":["Les verbes jouer et prendre","<b>jouer à</b> + jeu, sport · <b>jouer de</b> + instrument · <b>prendre</b> dans de nombreuses expressions : prendre la parole, prendre son temps, prendre une décision."],
"Luyện thêm: bày tỏ ý kiến":["Entraînement : exprimer son opinion","<b>Je pense que / je crois que</b> + indicatif.<br><b>Je ne pense pas que</b>, <b>il faut que</b>, <b>bien que</b>, les sentiments (content que…) + <b>subjonctif</b>.<br>Subjonctifs fréquents : que je sois, que j'aie, que je fasse, que je prenne, que j'aille."],
"Tính từ đổi nghĩa theo vị trí":["Adjectifs qui changent de sens selon leur place","Avant le nom, sens souvent figuré ; après le nom, sens propre : <b>un grand homme</b> (célèbre) / <b>un homme grand</b> (de grande taille) · <b>ma propre voiture</b> (à moi) / <b>une voiture propre</b> (pas sale)."],
"Hợp giống, số của phân từ quá khứ":["L'accord du participe passé","Avec <b>être</b> : accord avec le sujet · Avec <b>avoir</b> : accord avec le <b>COD placé avant</b> (que, la, les…) · Verbes pronominaux : accord si « se » est COD."],
"Bổ ngữ danh từ với de và lược bỏ mạo từ":["Le complément du nom et l'absence d'article","Pas d'article : profession, nationalité, religion après être · après <b>sans, avec</b> + nom abstrait (avec patience) · après <b>en</b> (en voiture) · dans les listes, panneaux, titres · après <b>de</b> dans un complément du nom (un cours de français)."],
"Từ vựng: công việc và tìm việc":["Vocabulaire : le travail et la recherche d'emploi","Pronom <b>y</b> pour un lieu (j'y vais), <b>en</b> pour une quantité (j'en ai deux).<br><b>lui / leur</b> remplacent une personne introduite par à : je lui explique.<br>Hypothèse : <b>si</b> + imparfait → conditionnel : si j'avais le temps, j'irais."],
"Gérondif":["Le gérondif","<b>en</b> + participe présent : simultanéité (Il chante <b>en</b> cuisinant), manière (<b>En</b> travaillant, tu réussiras), condition. Le sujet doit être le même que celui du verbe principal."],
"Nguyên nhân":["Exprimer la cause","parce que, puisque, comme, car, étant donné que, vu que · <b>à cause de, grâce à, en raison de, faute de</b> (par manque de) + nom."],
"Hệ quả":["Exprimer la conséquence","donc, alors, c'est pourquoi, par conséquent, si bien que, de sorte que · <b>si / tellement</b> + adjectif + que · verbe + <b>tant / tellement</b> · <b>tant de / tellement de</b> + nom + que."],
"Nguyên mẫu hiện tại và quá khứ":["L'infinitif présent et passé","Infinitif passé : <b>avoir / être</b> + participe passé (avoir fini, être parti(e)). Obligatoire après <b>après</b> : Après <b>avoir mangé</b>, il est sorti."],
"Cách dùng nguyên mẫu":["L'emploi de l'infinitif","Après une préposition : <b>pour, sans, avant de, au lieu de</b> + infinitif.<br>Verbe + <b>à</b> (commencer à, réussir à, aider à) · + <b>de</b> (décider de, essayer de, oublier de, arrêter de) · sans préposition (vouloir, pouvoir, aimer, préférer)."],
"qui, que, dont, où":["qui, que, dont, où","qui (sujet) · que (COD) · dont (remplace un complément introduit par de) · où (lieu, temps)."],
"Đại từ quan hệ dont":["Le pronom relatif dont","<b>dont</b> remplace un complément introduit par <b>de</b> : parler de, avoir besoin de, être fier de, possession (un ami dont le père…)."],
"Plus-que-parfait":["Le plus-que-parfait","<b>avoir / être</b> à l'imparfait + participe passé : J'<b>avais</b> fini, elle <b>était</b> partie.<br>Action <b>antérieure</b> à une autre action passée."],
"Giới từ chỉ thời gian":["Les prépositions de temps","<b>dès</b> (à partir du moment où), <b>jusqu'à</b>, <b>à partir de</b>, <b>avant / après</b> + nom, <b>lors de</b> (au moment de), <b>au bout de</b> (après une durée), <b>d'ici</b> (entre maintenant et)."],
"Biến đổi cú pháp":["Le discours indirect : transformations","Affirmation : il dit <b>que</b>… · Question fermée : il demande <b>si</b>… · Les mots interrogatifs restent ; qu'est-ce que → <b>ce que</b>, qu'est-ce qui → <b>ce qui</b> · Impératif : il dit <b>de</b> + infinitif.<br>Adaptez pronoms et possessifs."],
"Nhấn mạnh (mise en relief)":["La mise en relief","<b>C'est … qui</b> (sujet mis en relief), <b>C'est … que</b> (autre élément) · <b>Ce qui …, c'est …</b> · <b>Ce que …, c'est …</b>."],
"Đại từ quan hệ với đại từ chỉ định":["Relatifs et pronoms démonstratifs","<b>ce qui</b> (sujet), <b>ce que</b> (COD), <b>ce dont</b> (complément en de) · <b>celui / celle / ceux qui, que, dont</b>."],
"Danh từ hóa":["La nominalisation","Transformer un verbe en nom pour écrire de façon concise (titres de presse) : arriver → <b>l'arrivée</b>, fermer → <b>la fermeture</b>, choisir → <b>le choix</b>, lancer → <b>le lancement</b>."],
"Thể bị động":["La voix passive","<b>être</b> (au temps de la phrase active) + participe passé (accordé avec le sujet) + <b>par</b> (ou <b>de</b> avec les verbes de sentiment ou de description : aimé de tous)."],
"Dạng phản thân mang nghĩa bị động":["La forme pronominale à sens passif","<b>se</b> + verbe, avec un sujet non humain : Ce vin <b>se boit</b> frais (= est bu). Ça <b>se dit</b> ? Ce livre <b>se vend</b> bien."],
"Từ vựng: báo chí và xã hội":["Vocabulaire : presse et société","La <b>nominalisation</b> rend l'écrit plus concis : augmenter → l'augmentation, baisser → la baisse.<br>Passif : <b>être</b> + participe (+ par) : la loi a été adoptée par…<br><b>dont</b> remplace un complément en « de » : un sujet dont on parle."],
"Câu giả định với si":["L'hypothèse avec si","<b>si</b> + présent → futur / présent / impératif (hypothèse probable).<br><b>si</b> + imparfait → conditionnel présent (irréel du présent).<br><b>si</b> + plus-que-parfait → conditionnel passé (irréel du passé)."],
"Điều kiện":["Exprimer la condition","<b>à condition que</b> / <b>à moins que</b> + subjonctif · <b>au cas où</b> + conditionnel · <b>en cas de</b> + nom · <b>à condition de</b> + infinitif · <b>sinon</b>."],
"Đại từ quan hệ với giới từ":["Les relatifs composés","Préposition + <b>qui</b> (personnes) : la personne avec qui… · Préposition + <b>lequel / laquelle / lesquels / lesquelles</b> (choses).<br>à + lequel = <b>auquel</b>, à + lesquels = <b>auxquels</b> ; de + lequel = <b>duquel</b> (après une locution : près duquel)."],
"Tương lai gần và tương lai đơn":["Futur proche et futur simple","Futur simple pour la prédiction, la promesse, les projets lointains ; après <b>quand, lorsque, dès que, aussitôt que</b> à valeur future."],
"Tương lai trước (futur antérieur)":["Le futur antérieur","<b>avoir / être</b> au futur simple + participe passé : j'<b>aurai fini</b>, elle <b>sera partie</b>.<br>Action future <b>antérieure</b> à une autre action future."],
"Conditionnel hiện tại và quá khứ":["Le conditionnel présent et passé","Présent : radical du futur + terminaisons de l'imparfait (je <b>voudrais</b>, nous <b>serions</b>).<br>Passé : <b>avoir / être</b> au conditionnel + participe (j'<b>aurais aimé</b>, elle <b>serait venue</b>)."],
"Cách dùng conditionnel":["Les emplois du conditionnel","Politesse (Je voudrais…, Pourriez-vous…) · conseil (Tu devrais…) · souhait (J'aimerais…) · information non confirmée (Le président serait malade) · regret (J'aurais dû…)."],
"Phân từ hiện tại":["Le participe présent","Radical de <b>nous</b> au présent + <b>-ant</b> : nous finiss-ons → <b>finissant</b>. Irréguliers : <b>étant, ayant, sachant</b>.<br>Remplace une relative avec qui ou exprime la cause (style écrit) : Les étudiants <b>ayant</b> réussi…"],
"Cách dùng subjonctif":["Les emplois du subjonctif","Après la volonté (vouloir, souhaiter, préférer que), l'obligation (il faut, il est nécessaire que), le sentiment (regretter, avoir peur que), le doute (douter que), la possibilité (il est possible que) et les conjonctions <b>pour que, bien que, avant que, à condition que, sans que, jusqu'à ce que</b>."],
"Đối lập và nhượng bộ":["Opposition et concession","Opposition : <b>alors que, tandis que, au lieu de</b> · Concession : <b>bien que</b> + subjonctif, <b>même si</b> + indicatif, <b>malgré</b> + nom, <b>pourtant, cependant</b>, <b>avoir beau</b> + infinitif."],
"Luyện thêm: nguyên nhân, hệ quả, nhượng bộ":["Entraînement : cause, conséquence, concession","Cause : <b>à cause de</b> (négatif), <b>grâce à</b> (positif), parce que, puisque.<br>Concession : <b>bien que</b> + subjonctif, <b>même si</b> + indicatif, <b>malgré</b> + nom.<br>But : <b>pour que</b> + subjonctif."],
"Phối hợp thì":["La concordance des temps","Quand le verbe introducteur est au passé : présent → <b>imparfait</b>, passé composé → <b>plus-que-parfait</b>, futur → <b>conditionnel</b>. aujourd'hui → ce jour-là, demain → le lendemain, hier → la veille."],
"Ý kiến: subjonctif hay indicatif?":["Opinion : subjonctif ou indicatif ?","Affirmatif <b>je pense, je crois, je trouve, il me semble que</b> + <b>indicatif</b>.<br>Négatif ou interrogatif avec inversion (je ne pense pas que, crois-tu que…) + <b>subjonctif</b>."],
"Plus-que-parfait trong câu chuyện":["Le plus-que-parfait dans le récit","Combinez le <b>plus-que-parfait</b> (antériorité), l'<b>imparfait</b> (décor) et le <b>passé composé</b> (événements)."],
"Cách dùng các đại từ bổ ngữ":["Les pronoms compléments","COD : le, la, les · COI : lui, leur · <b>en</b> : de + nom, quantité · <b>y</b> : lieu, à + chose · Le pronom neutre <b>le</b> reprend une proposition : Je <b>le</b> sais."],
"Thứ tự đại từ kép":["L'ordre des doubles pronoms","Devant le verbe : <b>me, te, se, nous, vous</b> → <b>le, la, les</b> → <b>lui, leur</b> → <b>y</b> → <b>en</b>.<br>Impératif affirmatif : verbe – <b>le/la/les</b> – <b>moi/lui/nous/leur</b> – y – en : Donne-<b>le-moi</b> !"],
"Ôn tập các thì":["Révision des temps","Présent, imparfait, futur, conditionnel, subjonctif : reconnaître et conjuguer rapidement."],
"Subjonctif hiện tại và quá khứ":["Subjonctif présent et passé","Subjonctif passé : <b>avoir / être</b> au subjonctif + participe passé : que j'<b>aie fini</b>, qu'elle <b>soit partie</b>."],
"Subjonctif quá khứ":["Le subjonctif passé","<b>avoir / être</b> au subjonctif + participe passé : que j'<b>aie fini</b>, qu'elle <b>soit partie</b>. Exprime une action accomplie par rapport à la principale."],
"Nhắc lại bằng danh từ và đại từ (reprise)":["La reprise nominale et pronominale","Pour éviter les répétitions : un <b>synonyme ou un terme générique</b> (Montréal → la métropole québécoise) ou un <b>pronom</b> (celui-ci, celle-ci, ce dernier, le premier… le second)."],
"Từ vựng: chân dung, địa lý, giọng Québec":["Vocabulaire : portrait, géographie, accent québécois","bienveillant ≠ malveillant · une île, le littoral · homophones : mer / mère / maire."],
"Tính từ đuôi -ant và phân từ hiện tại":["Adjectif verbal et participe présent","Participe présent (invariable) : fatig<b>u</b>ant, convain<b>qu</b>ant, néglig<b>e</b>ant · Adjectif verbal (accordé) : fatig<b>a</b>nt, convain<b>c</b>ant, néglig<b>e</b>nt."],
"Nhấn mạnh (nâng cao)":["La mise en relief (approfondissement)","<b>Ce que / ce qui / ce dont …, c'est …</b> · <b>C'est + complément + que</b> (C'est à Montréal que…) · détachement en tête de phrase avec reprise pronominale."],
"Các thì quá khứ và hợp phân từ (nâng cao)":["Temps du passé et accord du participe (approfondissement)","Cas particuliers : <b>fait + infinitif</b> invariable · participe des pronominaux accordé selon le COD · verbes de durée ou de prix (vivre, coûter) invariables avec un complément de mesure."],
"en, y và le trung tính":["en, y et le pronom neutre le","<b>le</b> reprend un adjectif ou une proposition (Ambitieux ? Il l'est) · <b>en</b> = de + chose (être fier de, rêver de) · <b>y</b> = à + chose (tenir à) · pour les personnes : de lui, à elle…"],
"Động từ chỉ ý kiến (nâng cao)":["Les verbes d'opinion (approfondissement)","Affirmatif (estimer, considérer, trouver, il me paraît évident que) + <b>indicatif</b> · négatif, interrogatif avec inversion, douter que, ne pas être convaincu que + <b>subjonctif</b>."],
"Các dạng câu hỏi":["Les formes interrogatives","Trois registres : intonation (familier), est-ce que (courant), inversion (soutenu) · interrogation indirecte : <b>ce que, ce qui, si</b> · préposition + <b>quoi / qui / lequel</b>."],
"Phủ định và hạn chế (nâng cao)":["Négation et restriction (approfondissement)","<b>ne… guère</b> (presque pas), <b>ne… ni… ni</b>, <b>nul / aucun… ne</b>, <b>ne… que</b> (seulement), <b>ne pas que</b> (pas seulement). À l'oral, le « ne » disparaît souvent."],
"So sánh nhất":["Le superlatif","<b>le/la/les plus</b> + adjectif (+ <b>de</b>) · <b>le moins</b> · <b>le meilleur</b>, <b>le mieux</b>.<br>Verbe + <b>le plus / le moins</b>. Nom : <b>le plus de</b>."],
"Giả định và subjonctif":["Hypothèse et subjonctif","Irréel du passé : <b>si</b> + plus-que-parfait → <b>conditionnel passé</b> : si j'avais su, je serais venu.<br>Regret : j'aurais dû…<br><b>Au cas où</b> + conditionnel ; <b>avant que, à condition que, pourvu que, sans que, à moins que</b> + subjonctif."],
"Bị động (nâng cao)":["Le passif (approfondissement)","<b>se faire</b> + infinitif : Il s'est fait voler · passif à tous les temps · seuls les verbes avec COD se mettent au passif · passif pronominal : Ça ne se fait pas."],
"Đối lập và nhượng bộ (nâng cao)":["Opposition et concession (approfondissement)","<b>quel(le)s que soient</b>, <b>si + adjectif + que</b> + subjonctif, <b>tout + adjectif + que</b> + indicatif, <b>quand bien même</b> + conditionnel, <b>avoir beau</b>, <b>loin de</b>, <b>néanmoins</b>."],
"Điều kiện (nâng cao)":["La condition (approfondissement)","<b>pour peu que, à supposer que, supposons que</b> + subjonctif · <b>dans l'hypothèse où</b> + conditionnel · <b>moyennant, sans</b> + nom."],
"Mệnh đề quan hệ với subjonctif":["Relatives au subjonctif","Subjonctif quand l'antécédent est <b>indéterminé</b> ou souhaité, après un <b>superlatif / le seul / le premier</b>, après <b>il n'y a personne qui…</b>."],
"Diễn đạt thời gian (nâng cao)":["Exprimer le temps (approfondissement)","<b>à peine… que</b>, <b>une fois</b> + participe, <b>sitôt</b> + participe, <b>au fur et à mesure que</b>, <b>d'ici là</b>."],
"Diễn đạt khả năng (probabilité)":["Exprimer la probabilité","<b>il est probable que</b> + indicatif · <b>il est peu probable / il se peut / il se pourrait que</b> + subjonctif · <b>devoir</b> (probabilité) : il a dû partir · <b>sans doute</b> = probablement."],
"Nghi ngờ và chắc chắn":["Doute et certitude","Certitude (je suis sûr, il est certain, il est évident que) + <b>indicatif</b> · Doute (je doute, je ne suis pas sûr, ça m'étonnerait que) + <b>subjonctif</b>."],
"Đại từ kép (nâng cao)":["Les doubles pronoms (approfondissement)","Ordre : me/te/se/nous/vous → le/la/les → lui/leur → y → en · Impératif affirmatif : Emmène-<b>m'y</b> ! Donnez-<b>nous-en</b> !"],
"Mục đích":["Exprimer le but","<b>pour, afin de</b> + infinitif (même sujet) · <b>pour que, afin que</b> + subjonctif (sujets différents) · <b>de peur de / de peur que</b>."],
"Mục đích (nâng cao)":["Le but (approfondissement)","<b>de crainte que / de peur que</b> (+ ne) + subjonctif · <b>de manière / de sorte que</b> + subjonctif (but) · <b>en vue de, dans le but de</b> + infinitif."],
"Câu tường thuật ở quá khứ (nâng cao)":["Le discours rapporté au passé (approfondissement)","Concordance : présent → imparfait, passé composé → plus-que-parfait, futur → conditionnel · hier → la veille, demain → le lendemain, ici → là · verbes introducteurs : promettre, ordonner, avouer…"],
"Passé simple (thì kể chuyện trong văn viết)":["Le passé simple (temps du récit écrit)","Le <b>passé simple</b> s'emploie dans le récit littéraire, historique, la presse soutenue ; il remplace le passé composé à l'écrit.<br>-er : il parl<b>a</b>, ils parl<b>èrent</b> · -ir/-re : il fin<b>it</b>, il pr<b>it</b> · -oir : il voul<b>ut</b>.<br>Irréguliers : être → il <b>fut</b>, avoir → il <b>eut</b>, venir → il <b>vint</b>, naître → il <b>naquit</b>."],
"Subjonctif imparfait, plus-que-parfait và phối thì":["Subjonctif imparfait, plus-que-parfait et concordance","La langue soutenue emploie le <b>subjonctif imparfait</b> (qu'il <b>fût</b>, qu'il <b>vînt</b>) et le <b>plus-que-parfait du subjonctif</b> (qu'il <b>eût fait</b>). Il suffit de les <b>reconnaître</b>.<br>Langue moderne : subjonctif présent ou passé (Il fallait qu'il <b>vienne</b>)."],
"Từ nối lập luận nâng cao":["Les connecteurs logiques avancés","<b>or</b> (introduit un fait nouveau) · <b>dès lors</b> (par conséquent) · <b>a fortiori</b> (à plus forte raison) · <b>en l'occurrence</b> (dans ce cas précis) · <b>faute de</b> (par manque de) · <b>nonobstant</b> (malgré) · <b>partant</b> (donc) · <b>encore que</b> + subjonctif (bien que)."],
"Giảm nhẹ và nhấn mạnh quan điểm (modalisation)":["La modalisation","Atténuer : <b>il me semble que</b>, <b>on pourrait penser que</b>, conditionnel journalistique (<b>il aurait démissionné</b> = information non confirmée) · Renforcer : <b>il est indéniable que</b>, <b>force est de constater que</b> · <b>il n'est pas exclu que</b> + subjonctif."],
"Phân từ, gérondif, mệnh đề phân từ":["Participes, gérondif et proposition participiale","<b>Participe présent</b> (invariable) : les personnes possédant un billet · <b>Participe composé</b> : <b>ayant</b> appris, <b>étant</b> parti · <b>Gérondif</b> (en + -ant) : même sujet que le verbe principal · Proposition participiale : <b>Le dîner terminé</b>, nous sommes sortis."],
"Văn phong và thành ngữ":["Registres et expressions idiomatiques","Distinguer le <b>familier</b> (bosser, une bagnole) et le <b>soutenu</b> (travailler, une voiture) · expressions idiomatiques fréquentes à l'examen · formules de la lettre formelle."],
"Danh từ hóa và diễn đạt lại":["Nominalisation et reformulation","L'écrit de niveau C1 privilégie la nominalisation, plus concise et objective : <b>Les prix augmentent fortement</b> → <b>la forte augmentation des prix</b>."],
"Hợp giống, số khó: tout, demi, nu, même, quelque":["Accords difficiles : tout, demi, nu, même, quelque","<b>tout</b> adverbe est invariable, sauf devant un adjectif féminin commençant par une consonne ou un h aspiré (toutes honteuses) · <b>demi</b> : midi et demi, une heure et demie · <b>nu-pieds</b> · <b>quelque</b> = environ (invariable) · <b>quelque(s) + nom + que</b> · <b>coûter, valoir</b> + prix : participe invariable."],
"Đọc và nghe hiểu văn bản nghị luận":["Comprendre un texte argumentatif","Repérez connecteurs et modalisateurs : <b>voire</b> (et même), <b>in fine</b> (finalement), <b>loin de</b> (pas du tout), <b>il n'en demeure pas moins que</b> (malgré tout)."],
"Sắc thái lập luận":["Nuancer son argumentation","<b>Quel(le)(s) que soit/soient</b> + nom ; <b>quoi que</b> + subjonctif.<br><b>Pour peu que</b> + subjonctif : il suffit que.<br>Concéder puis réfuter : <b>certes…, toujours est-il que / il n'en demeure pas moins que…</b>"],
"Văn phong trang trọng":["Le registre soutenu","Ouverture : <b>Madame, Monsieur,</b><br>Formule finale : <b>Je vous prie d'agréer, Madame, Monsieur, l'expression de mes salutations distinguées.</b><br>Tournures utiles : suite à, je me permets de, je vous saurais gré de, veuillez trouver ci-joint."],
"Thành ngữ & kết hợp từ":["Expressions et collocations","Les collocations sont très valorisées au C1 : <b>prendre</b> une décision, <b>susciter</b> un débat, <b>mettre en œuvre</b> une mesure, <b>jouer</b> un rôle.<br>Apprenez des groupes de mots, pas des mots isolés."],
"Ngữ pháp văn chương":["La grammaire littéraire","<b>Passé simple</b> (récit) : il fut, il eut, il fit, il vint, ils quittèrent.<br><b>Subjonctif imparfait</b> (à reconnaître) : qu'il partît, qu'il fût.<br><b>Ne explétif</b> : je crains qu'il <b>ne</b> soit trop tard (sans valeur négative)."],
"Thành ngữ nâng cao":["Expressions idiomatiques avancées","Bien placées, les expressions rendent l'oral C2 naturel. N'en abusez pas : une ou deux expressions justes valent mieux que cinq expressions forcées."],
"Tóm tắt & tổng hợp":["Résumé et synthèse","Synthèse DALF : <b>pas</b> d'opinion personnelle, <b>pas</b> de phrases recopiées ; confrontez les documents par thèmes au lieu de les résumer un par un.<br>Connecteurs de confrontation : alors que, tandis que, à l'instar de, contrairement à."],

function voiceScore(v){

 let sc=0;
 if(isBadVoice(v))sc-=200;
 if(FEMALE.test(id))sc+=14;
 if(/premium/i.test(id))sc+=60;else if(/enhanced|améliorée?|natural|naturel|neural|online/i.test(id))sc+=45;
 if(/google/i.test(id))sc+=30;
 if(/am[eé]lie|thomas|audrey|aur[eé]lie|marie|daniel|chantal|nicolas|denise|henri|eloise|vivienne|r[eé]my|sylvie|antoine|jean|thierry|julie|hortense|paul|claude|jerome|j[eé]r[oô]me|coralie|virginie|ariane|celeste|c[eé]line|lea|l[eé]a|mathieu|fabrice/i.test(id))sc+=10;

const VI_CHARS=/[ăđơưạảấầẩẫậắằẳẵặẹẻẽếềểễệỉịĩọỏốồổỗộớờởỡợụủũứừửữựỳỵỷỹ]/i;
function frSpeech(text){
 let t=String(text||"");

 t=t.replace(/\b(\w+)\/(\w+)\b/g,"$1 ou $2").replace(/\s*&\s*/g," et ");
 t=t.replace(/([.!?…])\s*,\s*/g,"$1 ").replace(/\s+([,.!?;:])/g,"$1").replace(/([,.]){2,}/g,"$1").replace(/\s{2,}/g," ").trim();

function chunks(t){const out=[];(t.match(/[^.!?…;:]+[.!?…;:]*\s*/g)||[]).map(x=>x.trim()).forEach(seg=>{while(seg.length>200){let cut=seg.lastIndexOf(", ",200);if(cut<60)cut=seg.lastIndexOf(" ",200);if(cut<1)cut=200;out.push(seg.slice(0,cut+1));seg=seg.slice(cut+1).trim();}if(seg)out.push(seg);});return out;}

const RATE_MAP={0.6:0.5,0.75:0.62,0.95:0.76,1.1:0.9};

 html+=`<div class="card" style="text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px">${mascot(90)}<h3>${next?(lvOpen(next)?"Bạn đã mở khóa "+next+"!":"Sẵn sàng lên "+next+"?"):"Bạn đã ở trình độ cao nhất!"}</h3><p class="muted" style="margin:0">${next?(lvOpen(next)?"Bạn có thể chuyển sang "+next+" ngay hoặc tiếp tục ôn "+lv+".":"Làm bài kiểm tra 50 câu trắc nghiệm, đạt từ 80% (40/50) để mở khóa "+next+"."):"Hãy luyện đề thi minh họa để giữ phong độ."}</p>${next?(lvOpen(next)?`<button class="btn ghost sm" id="go-next">Chuyển sang ${next}</button>`:`<button class="btn sm" data-test="${lv}">${icon("trophy")}Làm bài kiểm tra lên ${next}</button>`):""}</div>`;

 return html;
}
function nodeOf(lv,u,k){return NODES[lv][u].nodes[k];}
function nodeItems(lv,u,k){const n=nodeOf(lv,u,k);return n.bilan?shuffle(n.items).slice(0,12):shuffle(n.items);}
function startNode(lv,u,k){const n=nodeOf(lv,u,k),U=NODES[lv][u];startSession(nodeItems(lv,u,k),{kind:"lesson",node:n.id,xp:P.done[n.id]?5:n.xp,title:n.bilan?"Bilan · "+U.title:n.title.replace(/^[A-F]\.\s*/,"")+(n.part?` (${n.part}/${n.parts})`:"")});}
function openNode(lv,u,k){
 const n=nodeOf(lv,u,k),U=NODES[lv][u];
 const body=n.bilan?`<p style="font-size:15px;line-height:1.7">Ôn tập tổng hợp ${U.lessons.length} bài của chương: 12 câu chọn ngẫu nhiên, mỗi lần làm là một đề khác.</p>`:`<div class="tipbox">${n.tip||""}</div>`;
 openSheet(`<div class="eyebrow">${esc(U.title)}</div><h2>${esc(n.bilan?"Bilan":n.title)}${n.part?` <span class="tag">Phần ${n.part}/${n.parts}</span>`:""}</h2>${body}<div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn ghost" data-close>Để sau</button><button class="btn" id="node-go">${icon("star")}Bắt đầu · ${n.bilan?Math.min(12,n.items.length):n.items.length} câu</button></div>`,()=>{$("#node-go").onclick=()=>{closeSheet();startNode(lv,u,k);};});
}

/* ===== Bài học ===== */
let S=null;
const PRAISE=["Excellent !","Bravo !","Parfait !","Très bien !","Exactement !"];
function prep(it){
 const p={...it,src:it};
 if(["mcq","fill","listen","read"].includes(it.t)){const idx=shuffle(it.o.map((_,i)=>i));p.opts=idx.map(i=>it.o[i]);p.ans=idx.indexOf(0);}
 if(it.t==="order"){p.bank=shuffle([...it.fr,...it.dis]).map(w=>({w,used:false}));p.line=[];}
 if(it.t==="match"){p.L=shuffle(it.pairs.map((x,i)=>({txt:x[0],k:i})));p.R=shuffle(it.pairs.map((x,i)=>({txt:x[1],k:i})));p.matched=new Set();p.pick=null;}
 return p;
}
function startSession(items,meta){
 if(!items.length){toast("Chưa có câu nào để luyện.");return;}
 S={meta,items,queue:items.map(prep),pos:0,hearts:5,uniq:new Set(items.map(i=>i.id)).size,good:new Set(),missed:new Set(),start:Date.now(),sel:null,state:"answer"};
 openOverlay();drawLesson();
}
function drawLesson(){
 const q=S.queue[S.pos];if(!q)return finishSession();
 $("#overlay").innerHTML=`<div class="ov-top"><button class="x" id="l-close" aria-label="Thoát bài học">${icon("x")}</button><div class="prog" role="progressbar" aria-label="Tiến độ bài" aria-valuemin="0" aria-valuemax="${S.uniq}" aria-valuenow="${S.good.size}"><i style="width:${S.good.size/S.uniq*100}%"></i></div><span class="hearts" aria-label="${S.hearts} tim">${icon("heart")}<span class="tnum">${S.hearts}</span></span></div><div class="ov-body"><div class="ov-inner" id="l-q"></div></div><div class="ov-foot" id="l-foot"></div>`;
 $("#l-close").onclick=confirmQuit;
 S.state="answer";S.sel=null;
 $("#l-q").innerHTML=qHTML(q);bindQ(q);footAnswer(q);
 if(q.t==="listen")setTimeout(()=>speak(q.say),250);
}
function optsHTML(q){return `<div class="opts" role="group" aria-label="Các lựa chọn">${q.opts.map((o,i)=>`<button class="opt" data-i="${i}" aria-pressed="false"><span class="k">${i+1}</span><span>${esc(o)}</span></button>`).join("")}</div>`;}
function speakerHTML(){return HAS_TTS?`<div class="speaker"><button class="spk" id="spk" aria-label="Réécouter">${icon("speaker")}</button><button class="spk slow" id="spk-slow" aria-label="Écouter lentement">${icon("slow")}</button>${noFrVoice()?`<button class="linkbtn" id="show-tr">Afficher la transcription</button>`:""}</div>${noFrVoice()?`<div id="tr" class="passage fr" hidden></div>`:""}`:`<p class="muted">Trình duyệt này không có giọng đọc tiếng Pháp. <button class="linkbtn" id="show-tr">Hiện lời thoại</button></p><div id="tr" class="passage" hidden></div>`;}
function qHTML(q){
 switch(q.t){
  case "mcq":return `<div class="q-sub">Choisissez la bonne réponse</div><h2 class="q-title">${esc(q.q)}</h2>${optsHTML(q)}`;
  case "fill":return `<div class="q-sub">Complétez la phrase</div><p class="sentence fr">${esc(q.q).replace("___",'<span class="blank" id="blank">&nbsp;</span>')}</p>${optsHTML(q)}`;
  case "listen":return `<div class="q-sub">Écoutez et choisissez</div>${speakerHTML()}<h2 class="q-title">${esc(q.q)}</h2>${optsHTML(q)}`;
  case "read":return `<div class="q-sub">Lisez et répondez</div><div class="passage fr">${esc(q.text)}</div><h2 class="q-title">${esc(q.q)}</h2>${optsHTML(q)}`;
  case "order":return `<div class="q-sub">Remettez les mots dans l'ordre</div><div class="vi">${mascot(64)}<div class="say">${esc(q.vi)}</div></div><div class="order-line" id="line" aria-label="Câu của bạn"></div><div class="bank" id="bank"></div>`;
  case "type":return `<div class="q-sub">Traduisez en français</div><div class="vi">${mascot(64)}<div class="say">${esc(q.vi)}</div></div><textarea class="ans fr" id="ans" placeholder="Écrivez en français…" lang="fr" autocomplete="off" spellcheck="false"></textarea><p class="muted" style="font-size:13px">Gõ thiếu dấu vẫn được tính đúng, nhưng app sẽ nhắc bạn chỗ thiếu dấu.</p>`;
  case "match":return `<div class="q-sub">Associez les paires</div><h2 class="q-title">Touchez un mot à gauche, puis sa traduction à droite</h2><div class="match"><div class="col" id="mL"></div><div class="col" id="mR"></div></div>`;
 }
 return "";
}
function bindQ(q){
 $$(".opt[data-i]").forEach(b=>b.onclick=()=>selectOpt(+b.dataset.i));
 const sp=$("#spk");if(sp){const say=q.say;sp.onclick=()=>speak(say);$("#spk-slow").onclick=()=>speak(say,true);}
 const st=$("#show-tr");if(st)st.onclick=()=>{const t=$("#tr");t.textContent=q.say;t.hidden=false;};
 if(q.t==="order")drawOrder(q);
 if(q.t==="type"){const a=$("#ans");a.oninput=()=>{$("#primary").disabled=!a.value.trim();};setTimeout(()=>a.focus(),50);a.onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();if(!$("#primary").disabled)$("#primary").click();}};}
 if(q.t==="match")drawMatch(q);
}
function selectOpt(i){
 if(S.state!=="answer")return;const q=S.queue[S.pos];if(!q.opts||i>=q.opts.length)return;
 S.sel=i;$$(".opt[data-i]").forEach(b=>b.setAttribute("aria-pressed",String(+b.dataset.i===i)));
 const bl=$("#blank");if(bl)bl.textContent=q.opts[i];
 $("#primary").disabled=false;
}
function drawOrder(q){
 $("#line").innerHTML=q.line.map((bi,pos)=>`<button class="tile fr" data-pos="${pos}">${esc(q.bank[bi].w)}</button>`).join("");
 $("#bank").innerHTML=q.bank.map((t,bi)=>`<button class="tile fr ${t.used?"ghost":""}" data-bi="${bi}" ${t.used?'disabled aria-hidden="true"':""}>${esc(t.w)}</button>`).join("");
 if(S.state!=="answer")return;
 $$("#bank [data-bi]").forEach(b=>b.onclick=()=>{const bi=+b.dataset.bi;if(q.bank[bi].used)return;q.bank[bi].used=true;q.line.push(bi);if(q.line.length===1)speak(q.bank[bi].w);drawOrder(q);});
 $$("#line [data-pos]").forEach(b=>b.onclick=()=>{const pos=+b.dataset.pos;const bi=q.line[pos];q.bank[bi].used=false;q.line.splice(pos,1);drawOrder(q);});
 const pr=$("#primary");if(pr)pr.disabled=!q.line.length;
}
function drawMatch(q){
 const cell=(side,x)=>{const gone=q.matched.has(x.k);const sel=side==="L"&&q.pick===x.k;return `<button class="opt ${gone?"gone":""} ${side==="L"?"fr":""}" data-side="${side}" data-k="${x.k}" aria-pressed="${sel}" ${gone?"disabled":""}>${esc(x.txt)}</button>`;};
 $("#mL").innerHTML=q.L.map(x=>cell("L",x)).join("");$("#mR").innerHTML=q.R.map(x=>cell("R",x)).join("");
 $$("#mL [data-k]").forEach(b=>b.onclick=()=>{q.pick=+b.dataset.k;speak(q.L.find(x=>x.k===q.pick).txt);drawMatch(q);});
 $$("#mR [data-k]").forEach(b=>b.onclick=()=>{
  if(q.pick===null){toast("Chọn một từ bên trái trước.");return;}
  const k=+b.dataset.k;
  if(k===q.pick){q.matched.add(k);q.pick=null;drawMatch(q);if(q.matched.size===q.pairs.length){S.sel="match";feedback({ok:true,right:"",matchDone:true});}}
  else{q.hadErr=true;b.classList.add("wrong");setTimeout(()=>b.classList.remove("wrong"),450);}
 });
}
function footAnswer(q){
 const f=$("#l-foot");f.className="ov-foot";
 f.innerHTML=`<div class="in"><button class="btn ghost" id="l-skip">Passer</button>${q.t==="match"?"":`<button class="btn green" id="primary" disabled>Vérifier</button>`}</div>`;
 $("#l-skip").onclick=()=>feedback({ok:false,right:rightText(q),skipped:true});
 const p=$("#primary");if(p)p.onclick=()=>feedback(evaluate(q));
}
function rightText(q){if(q.t==="order")return frJoin(q.fr);if(q.t==="type")return q.ans[0];if(q.t==="match")return q.pairs.map(p=>p[0]+" = "+p[1]).join(" · ");return q.opts[q.ans];}
function evaluate(q){
 if(q.t==="order"){const a=q.line.map(i=>q.bank[i].w).join(" ");return {ok:a===q.fr.join(" "),right:frJoin(q.fr),given:frJoin(q.line.map(i=>q.bank[i].w))};}
 if(q.t==="type"){const v=norm($("#ans").value);const exact=q.ans.some(a=>norm(a)===v);const loose=!exact&&q.ans.some(a=>strip(norm(a))===strip(v));return {ok:exact||loose,accent:loose,right:q.ans[0],given:$("#ans").value.trim()};}
 return {ok:S.sel===q.ans,right:q.opts[q.ans],given:S.sel!=null?q.opts[S.sel]:""};
}
function feedback(res){
 const q=S.queue[S.pos];S.state="feedback";
 const id=q.id;
 if(/^C[OE]\./.test(id))P.seen[id]=1;
 if(res.ok){S.good.add(id);if(res.matchDone&&q.hadErr){S.missed.add(id);P.mistakes[id]=(P.mistakes[id]||0)+1;}else if(S.meta.kind==="review"&&!S.missed.has(id))delete P.mistakes[id];}
 else{S.missed.add(id);P.mistakes[id]=(P.mistakes[id]||0)+1;if(!res.skipped&&!res.matchDone)S.hearts--;if(res.matchDone){S.good.add(id);}else S.queue.push(prep(q.src));}
 if(q.opts){$$(".opt[data-i]").forEach(b=>{const i=+b.dataset.i;b.disabled=true;if(i===q.ans)b.classList.add("right");else if(i===S.sel)b.classList.add("wrong");});}
 if(q.t==="order")drawOrder(q);
 if(q.t==="type")$("#ans").readOnly=true;
 const hs=$(".hearts .tnum");if(hs)hs.textContent=S.hearts;
 const pr=$(".ov-top .prog i");if(pr)pr.style.width=(S.good.size/S.uniq*100)+"%";
 let say=null;
 if(q.t==="fill")say=q.q.replace("___",q.opts[q.ans]);else if(q.t==="order")say=frJoin(q.fr);else if(q.t==="type")say=q.ans[0];else if(q.t==="listen")say=q.say;
 const ok=res.ok;
 const title=ok?(res.accent?"Juste ! Attention aux accents":res.matchDone&&q.hadErr?"Terminé ! Plus de précision la prochaine fois":PRAISE[Math.floor(Math.random()*PRAISE.length)]):(res.skipped?"Question passée":"Pas tout à fait…");
 let body="";
 if(!ok||res.accent)body+=`<p><b>Réponse correcte :</b> <span class="fr">${esc(res.right)}</span></p>`;
 if(q.t==="listen"&&!ok)body+=`<p><b>Transcription :</b> <span class="fr">${esc(q.say)}</span></p>`;
 if(q.t==="read"&&!ok&&q.ex)body+=`<p class="why">${icon("bulb")} ${esc(q.ex)}</p>`;
 else if(q.ex&&(!ok||res.accent||q.t==="fill"))body+=`<p class="why">${icon("bulb")} ${esc(q.ex)}</p>`;
 if(!ok&&q.rule)body+=`<details class="rule"><summary>Rappel de la règle</summary><div>${q.rule}</div></details>`;
 const canAsk=!ok&&!res.matchDone&&aiAvailable();
 const f=$("#l-foot");f.className="ov-foot "+(ok?"ok":"bad");
 f.innerHTML=`<div class="in"><div class="fb ${ok?"ok":"bad"}"><span class="badge">${icon(ok?"check":"x")}</span><div style="min-width:0"><h3>${title}</h3>${body}${say&&HAS_TTS?`<button class="ask-ai" id="fb-say">${icon("speaker")}Écouter la bonne réponse</button> `:""}${canAsk?`<button class="ask-ai" id="fb-ai">${icon("spark")}Pourquoi ? Explication de l'IA</button><div id="fb-ai-out"></div>`:""}</div></div><button class="btn ${ok?"green":"red"}" id="primary">Continuer</button></div>`;
 $("#primary").onclick=nextQ;$("#primary").focus();
 const fs=$("#fb-say");if(fs)fs.onclick=()=>speak(say);
 if(ok&&say&&q.t!=="listen")speak(say);
 const fa=$("#fb-ai");if(fa)fa.onclick=()=>explainAI(q,res,fa);
}
function nextQ(){stopSpeech();if(S.hearts<=0)return failSession();S.pos++;drawLesson();}
function confirmQuit(){openSheet(`<div style="display:flex;justify-content:center">${mascot(90,"sad")}</div><h2 style="text-align:center">Thoát bài này?</h2><p class="muted" style="text-align:center">Kết quả của bài đang làm sẽ không được lưu.</p><div style="display:flex;gap:10px;flex-direction:column"><button class="btn" data-close>Học tiếp</button><button class="btn ghost" id="q-yes" style="color:var(--red)">Thoát</button></div>`,()=>{$("#q-yes").onclick=()=>{closeSheet();closeOverlay();};});}

function annotate(text,errs){

 errs.forEach((e,i)=>{const o=String(e.original||"");if(!o.trim())return;let j=text.indexOf(o,cur);if(j<0){const k=text.indexOf(o);if(k>=0&&!spans.some(s=>k<s[1]&&k+o.length>s[0]))j=k;}if(j<0)return;if(spans.some(s=>j<s[1]&&j+o.length>s[0]))return;spans.push([j,j+o.length,i]);cur=j+o.length;});

 let out="",pos=0;
 spans.forEach(([s,e,i])=>{out+=esc(text.slice(pos,s))+`<mark class="k-${errKey(errs[i].type)}" data-n="${i}" title="${esc(errs[i].corrected||"")}">${esc(text.slice(s,e))}<sup>${i+1}</sup></mark>`;pos=e;});

}

function testForms(lv){
 if(TFORMS[lv])return TFORMS[lv];
 const rnd=rngFrom("lvtest-"+lv),seen=new Set(),groups=[];
 const add=(arr,g)=>arr.forEach(it=>{if(!TEST_TYPES.includes(it.t)||!it.o||it.o.length<2)return;const k=(it.q||"")+"|"+(it.say||it.text||"")+"|"+it.o[0];if(seen.has(k))return;seen.add(k);g.push(it);});
 NODES[lv].forEach(u=>{const g=[];add(u.all,g);if(g.length)groups.push(sshuf(g,rnd));});
 const extra=[];if(lv[0]==="C"||lv==="B2"){const b=bandOf(lv);add([...BANK.CO[b],...BANK.CE[b]],extra);}if(extra.length)groups.push(sshuf(extra,rnd));

 const nF=Math.max(1,Math.min(10,Math.floor(order.length/TEST_N))),forms=Array.from({length:nF},()=>[]);

}

const PLAN_N={20:2,40:3,60:4};
function planDay(){return P.plan?dayDiff(P.plan.start,todayStr()):-1;}
function planLevels(pl){const a=LEVELS.indexOf(pl.from),b=LEVELS.indexOf(pl.level),out=[];for(let i=Math.min(a,b);i<=Math.max(a,b);i++)out.push(LEVELS[i]);return out.length?out:[pl.level];}

 const ees=tasksFor(EE_BANK,ex,el),eos=tasksFor(EO_BANK,ex,el),w=Math.floor(d/2);
 const top=LEVELS[P.maxLv],first=LEVELS.indexOf(lv)>P.maxLv&&!(P.tests[top]&&P.tests[top].passed)?{type:"test",lv:top,label:"Bài kiểm tra lên "+LEVELS[P.maxLv+1],sub:"50 câu trắc nghiệm · cần đạt 80% để mở khóa"}:{type:"lesson",lv:LEVELS.indexOf(lv)>P.maxLv?top:lv,label:"Bài học tiếp theo · "+(LEVELS.indexOf(lv)>P.maxLv?top:lv),sub:"Ngữ pháp, từ vựng theo lộ trình · ~10 phút"};
 const t=[first,
  d%2===0?{type:"CO",band,label:"Nghe hiểu · 8 câu",sub:"Cấp "+bn+" · ~8 phút"}:{type:"CE",band,label:"Đọc hiểu · 8 câu",sub:"Cấp "+bn+" · ~10 phút"}];
 if(n>=3){if(d%2===0&&ees.length){const x=ees[w%ees.length];t.push({type:"EE",id:x.id,label:"Viết · "+x.title,sub:x.min+"–"+x.max+" từ · "+x.mins+" phút"});}else if(eos.length){const x=eos[w%eos.length];t.push({type:"EO",id:x.id,label:"Nói · "+x.title,sub:"Nói "+fmtTime(x.mins*60)});}}

}

/* Gemini: tự tìm mô hình Flash mới nhất mà khóa được dùng */
const GEM_BASE="https://generativelanguage.googleapis.com/v1beta/";
let GEM_MODELS=null;
async function gemModels(key,force){
 if(GEM_MODELS&&!force)return GEM_MODELS;
 const cached=lsGet("escalier.gemmodels");if(cached&&!force){try{const c=JSON.parse(cached);if(c.k===key.slice(-6)&&Date.now()-c.t<864e5*3){GEM_MODELS=c.m;return GEM_MODELS;}}catch(e){}}
 const r=await fetch(GEM_BASE+"models?pageSize=1000",{headers:{"x-goog-api-key":key}});
 if(!r.ok){const j=await r.json().catch(()=>({}));const err=new Error((j.error&&j.error.message)||("HTTP "+r.status));err.code=r.status===400||r.status===403?"bad_key":"http";throw err;}
 const j=await r.json();
 const ver=n=>{const m=/gemini-(\d+(?:\.\d+)?)/.exec(n);return m?parseFloat(m[1]):0;};
 const ok=(j.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes("generateContent")&&/gemini/.test(m.name)&&!/embed|tts|image|live|audio-dialog|native-audio|robotics|computer|learnlm|gemma/i.test(m.name)).map(m=>m.name.replace(/^models\//,""));
 const score=n=>ver(n)*10+(/flash/.test(n)?5:0)-(/lite/.test(n)?3:0)-(/preview|exp/.test(n)?1:0)-(/pro/.test(n)?8:0);
 GEM_MODELS=ok.sort((a,b)=>score(b)-score(a));
 lsSet("escalier.gemmodels",JSON.stringify({k:key.slice(-6),t:Date.now(),m:GEM_MODELS}));
 return GEM_MODELS;
}
async function gemGen(parts,{json=false,signal,temp=0.4}={}){
 const key=gemKey();if(!key)throw {code:"no_ai"};
 const models=(await gemModels(key)).slice(0,4);if(!models.length)throw {code:"no_model",message:"Không tìm thấy mô hình Gemini phù hợp."};
 let last;
 for(const m of models){
  const r=await fetch(GEM_BASE+"models/"+m+":generateContent",{method:"POST",signal,headers:{"Content-Type":"application/json","x-goog-api-key":key},body:JSON.stringify({contents:[{role:"user",parts}],generationConfig:Object.assign({temperature:temp},json?{responseMimeType:"application/json"}:{})})});
  if(r.ok){const j=await r.json();const c=j.candidates&&j.candidates[0];const t=c&&c.content&&(c.content.parts||[]).map(p=>p.text||"").join("");if(t)return t;last={code:"empty",message:"Gemini không trả lời (có thể bị bộ lọc an toàn chặn)."};continue;}
  const e=await r.json().catch(()=>({}));last={code:r.status===429?"rate_limited":r.status===400||r.status===403?"bad_key":"http",message:(e.error&&e.error.message)||("HTTP "+r.status)};
  if(r.status!==429&&r.status!==404&&r.status!==503)break;
 }
 throw last||{code:"http"};
}
/* Gọi AI chung: trả về chuỗi, hoặc đối tượng JSON khi json:true */
async function aiCall(prompt,{json=false,tier="default",signal,onText,audio}={}){
 await SAMPLE_P;
 if(SAMPLE&&!(audio&&gemKey())){
  if(json)return await SAMPLE.json(prompt,Object.assign({signal,modelTier:tier},tier==="complex"?{effort:"high"}:{}));
  const r=await SAMPLE(prompt,{signal,modelTier:tier,onText});return r.text;
 }
 if(gemKey()){
  const parts=[{text:prompt}];if(audio)parts.push({inline_data:{mime_type:audio.type,data:audio.b64}});
  const t=await gemGen(parts,{json,signal});if(onText)onText({text:t});return json?parseJSONloose(t):t;
 }

}
function aiErrMsg(e){const c=e&&e.code;if(c==="no_ai")return noAiMsg();if(c==="rate_limited")return "AI đang quá tải hoặc bạn đã dùng hết lượt miễn phí hôm nay. Thử lại sau ít phút.";if(c==="bad_key")return "Khóa Gemini không hợp lệ. Kiểm tra lại ở Hồ sơ → AI chấm bài.";if(c==="cancelled"||(e&&e.name==="AbortError"))return "Đã dừng.";if(["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"].includes(c))return "Tính năng AI chưa được bật cho trang này.";return "Chưa gọi được AI lần này"+(e&&e.message?" ("+e.message+")":"")+". Thử lại nhé.";}

const SRC=typeof window!=="undefined"?(window.SpeechRecognition||window.webkitSpeechRecognition):null;
function canDictate(){return STANDALONE&&!!SRC;}
function canRecord(){return STANDALONE&&!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.MediaRecorder);}
function micUsable(){return canDictate()||(canRecord()&&!!gemKey());}

/* Nhận dạng giọng nói trực tiếp (Web Speech API). onText(finalText, interimText) */
function startDictation(onText,onEnd){
 const rec=new SRC();rec.lang=P.accent==="ca"?"fr-CA":"fr-FR";rec.continuous=true;rec.interimResults=true;
 let finalTxt="",stopped=false;
 rec.onresult=e=>{let interim="";for(let i=e.resultIndex;i<e.results.length;i++){const r=e.results[i];if(r.isFinal)finalTxt+=r[0].transcript+" ";else interim+=r[0].transcript;}onText(finalTxt.trim(),interim);};
 rec.onerror=e=>{if(e.error==="not-allowed"||e.error==="service-not-allowed"){toast("Bạn cần cho phép dùng micro.");stopped=true;}};
 rec.onend=()=>{if(!stopped){try{rec.start();return;}catch(e){}}onEnd&&onEnd(finalTxt.trim());};
 try{rec.start();}catch(e){toast("Không bật được micro.");}
 return ()=>{stopped=true;try{rec.stop();}catch(e){}};
}
/* Ghi âm rồi chuyển sang WAV 16 kHz (để Gemini nghe và chép lời) */
async function startRecording(){
 const stream=await navigator.mediaDevices.getUserMedia({audio:true});
 const mr=new MediaRecorder(stream);const chunks=[];mr.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data);};mr.start();
 return {stop:()=>new Promise(res=>{mr.onstop=()=>{stream.getTracks().forEach(t=>t.stop());res(new Blob(chunks,{type:mr.mimeType||"audio/webm"}));};mr.stop();})};
}
async function blobToWav(blob){
 const buf=await blob.arrayBuffer();const AC=window.AudioContext||window.webkitAudioContext;const ac=new AC();
 const audio=await new Promise((res,rej)=>ac.decodeAudioData(buf,res,rej));
 const rate=16000,len=Math.ceil(audio.duration*rate);const off=new (window.OfflineAudioContext||window.webkitOfflineAudioContext)(1,len,rate);
 const src=off.createBufferSource();src.buffer=audio;src.connect(off.destination);src.start();const out=await off.startRendering();
 const data=out.getChannelData(0),ab=new ArrayBuffer(44+data.length*2),v=new DataView(ab);
 const ws=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i));};
 ws(0,"RIFF");v.setUint32(4,36+data.length*2,true);ws(8,"WAVE");ws(12,"fmt ");v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,rate,true);v.setUint32(28,rate*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);ws(36,"data");v.setUint32(40,data.length*2,true);
 for(let i=0;i<data.length;i++){const s=Math.max(-1,Math.min(1,data[i]));v.setInt16(44+i*2,s<0?s*0x8000:s*0x7fff,true);}
 try{ac.close();}catch(e){}
 return new Blob([ab],{type:"audio/wav"});
}
function blobToB64(blob){return new Promise(res=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(",")[1]||"");r.readAsDataURL(blob);});}

  await loadScript(b+"firebase-app-compat.js");await loadScript(b+"firebase-auth-compat.js");await loadScript(b+"firebase-firestore-compat.js");

async function runGrade(slot,task,text,kind,opts={}){

 if(words<8){toast("Hãy viết hoặc nói thêm một chút trước khi chấm nhé.");return;}
 const exKey=task.exam||P.exam,ex=EXAMS[exKey],max=ex.max,lv=task.level||examLevel(),rub=rubricFor(kind,task),lang=fbLang(lv);
 await SAMPLE_P;
 if(!aiAvailable()){slot.innerHTML=fallbackRubric(rub,noAiMsg());return;}
 slot.innerHTML=`<div class="grade"><div><span class="spinner"></span> <b>${lang==="fr"?"L'examinateur IA corrige votre production phrase par phrase…":"Giám khảo AI đang chấm kỹ từng câu…"}</b></div><span class="muted" style="font-size:13px">${aiName()} · thường mất 30 giây đến 2 phút.</span><div><button class="btn ghost sm" data-stop>${lang==="fr"?"Arrêter":"Dừng"}</button></div></div>`;
 const ctl=new AbortController();const sb=slot.querySelector("[data-stop]");if(sb)sb.onclick=()=>ctl.abort();
 const L=lang==="fr"?"en français clair et simple (niveau "+lv+")":"en vietnamien simple";
 const prompt=`Tu es examinateur-correcteur certifié ${ex.name}, professeur de FLE natif et bienveillant mais exigeant. Tu corriges ${kind==="EE"?"une production écrite":"la transcription d'une production orale (ne compte pas comme fautes les marques normales de l'oral : euh, répétitions)"} visant le niveau ${lv}.

CONSIGNE DE L'ÉPREUVE : ${task.prompt}
${task.docs?"DOCUMENTS :\n"+task.docs+"\n":""}${task.min?"LONGUEUR DEMANDÉE : "+task.min+" à "+task.max+" mots. Le texte compte "+words+" mots.\n":""}${opts.dialog?"DIALOGUE COMPLET (pour le contexte ; n'évalue que les répliques du candidat) :\n"+opts.dialog.slice(0,6000)+"\n":""}GRILLE OFFICIELLE : ${rub.join(" ; ")}.

PRODUCTION DU CANDIDAT (entre les balises) :
<texte>
${text.slice(0,7000)}
</texte>

MÉTHODE :
1. Relis phrase par phrase et relève TOUTES les erreurs réelles de langue, dans l'ordre (30 au maximum) : conjugaison, accord, grammaire (prépositions, articles, pronoms, modes), syntaxe, orthographe (accents compris), vocabulaire, ponctuation, registre.
2. Pour chaque erreur, "original" est copié EXACTEMENT du texte (1 à 6 mots), "corrected" donne le passage corrigé, "rule" nomme la règle précise et l'explique en une ou deux phrases ${L}. Ne signale jamais un passage correct comme faute.
3. Au-delà des erreurs, propose comme un professeur natif 3 à 8 reformulations pour un français plus naturel, plus idiomatique ou de niveau supérieur, y compris pour des phrases correctes ("naturel"), et 3 à 6 expressions ou connecteurs utiles à réutiliser ("expressions").
4. Note sur ${max} points avec la grille officielle et la sévérité d'un vrai jury ${ex.short} ; la somme des critères est égale à la note.${opts.audio?"\n5. Un enregistrement audio est joint : ajoute 2 à 4 remarques concrètes sur la prononciation, l'intonation et la fluidité dans \"prononciation\".":""}
Tous les commentaires sont rédigés ${L} ; corrections, reformulations et texte amélioré sont en français.

Réponds UNIQUEMENT avec un objet JSON :
{"score":0,"max":${max},"level":"${lv}","nclc":"${exKey==="tcf"||exKey==="tef"?"NCLC estimé, ex. NCLC 7":""}","summary":"bilan en 2-3 phrases","strengths":["point fort"],"criteria":[{"name":"critère","score":0,"max":0,"comment":"commentaire court"}],"errors":[{"original":"passage exact","corrected":"correction","type":"conjugaison|accord|grammaire|syntaxe|orthographe|vocabulaire|ponctuation|registre|style","rule":"explication"}],"naturel":[{"original":"phrase ou passage du candidat","mieux":"formulation plus naturelle","pourquoi":"pourquoi c'est mieux"}],"expressions":["expression utile"],"prononciation":[],"improved":"texte entièrement corrigé et amélioré, mêmes idées, niveau ${lv}","tips":["conseil concret pour gagner des points"]}`;
 try{
  const r=await aiCall(prompt,{json:true,tier:"complex",signal:ctl.signal,audio:opts.audio});

  slot.innerHTML=gradeHTML(r,max,text,sid,lang);

const ERR_FR={conjugaison:"Conjugaison",accord:"Accord",grammaire:"Grammaire",syntaxe:"Syntaxe",orthographe:"Orthographe",vocabulaire:"Vocabulaire",ponctuation:"Ponctuation",registre:"Registre",style:"Style"};

 <div class="eyebrow">${T("Corrections et règles","Sửa từng lỗi")}</div><div class="corr">${errs.map((e,i)=>`<div id="${sid}-e${i}"><span class="n">${i+1}</span><s class="fr">${esc(e.original)}</s> → <ins class="fr">${esc(e.corrected)}</ins><span class="ktag">${esc(TY[errKey(e.type)]||e.type||"")}</span><br><span class="muted">${esc(e.rule||e.why||"")}</span></div>`).join("")}</div>`:`<p style="margin:0;color:var(--green-d);font-weight:700">${T("Aucune erreur de langue détectée. Bravo !","Không phát hiện lỗi ngôn ngữ. Rất tốt!")}</p>`}

/* ===== Giám khảo ảo cho phần nói tương tác ===== */
function eoMode(t){
 const id=t.id||"",pl=t.plan;
 if(/^tcf-eo1/.test(id)||pl===PLANS.tcf1)return "entretien";
 if(/^tcf-eo2/.test(id)||/^tef-eoa/.test(id)||pl===PLANS.tcf2||pl===PLANS.tefA)return "questions";
 if(/^tef-eob/.test(id)||pl===PLANS.tefB)return "convaincre";
 if(pl===PLANS.dlg||pl===PLANS.inter)return "roleplay";
 if(pl===PLANS.pdv||pl===PLANS.expo||pl===PLANS.tcf3)return "debat";
 return "monologue";
}
const EO_MODE_INFO={
 entretien:["Entretien dirigé","L'examinateur vous pose des questions sur vous. Répondez en développant (2 à 4 phrases)."],
 questions:["Exercice en interaction","Vous posez des questions à l'examinateur pour obtenir des informations. Il joue le rôle de votre interlocuteur."],
 convaincre:["Exercice en interaction","Vous devez convaincre l'examinateur, qui joue votre ami(e) hésitant(e) et fait des objections."],
 roleplay:["Jeu de rôle","L'examinateur joue l'autre personne de la situation. Parlez avec lui pour régler la situation."],
 debat:["Monologue suivi + débat","Présentez votre point de vue, puis répondez aux questions et objections de l'examinateur."],
 monologue:["Monologue suivi","Parlez en continu sur le sujet. L'examinateur vous écoute."]
};
const EXR_ROLE={
 entretien:"Tu fais passer un entretien dirigé : pose au candidat des questions personnelles, une seule à la fois (présentation, famille, travail ou études, loisirs, ville, projets), en rebondissant sur ses réponses.",
 questions:"Tu joues la personne qui a publié l'annonce ou le document de la consigne. Le candidat te pose des questions : réponds précisément et de façon cohérente (invente des détails réalistes : prix, horaires, lieu, conditions), sans donner d'informations non demandées.",
 convaincre:"Tu joues l'ami(e) que le candidat doit convaincre. Tu hésites : à chaque réplique, formule une objection différente (prix, temps, intérêt, organisation, risques). Ne te laisse convaincre qu'après au moins quatre bons arguments.",
 roleplay:"Tu joues l'autre personnage de la situation décrite dans la consigne. Réagis naturellement, crée une petite complication, puis acceptez un accord.",
 debat:"Le candidat présente son point de vue sur le sujet. Pose-lui ensuite des questions de relance et des objections, une à la fois, pour l'amener à défendre et nuancer sa position.",
 monologue:"Écoute le candidat et, s'il s'arrête, relance-le avec une question ouverte sur le sujet."
};
const EXR_SCRIPT={
 entretien:["Bonjour ! Je suis votre examinateur. Pour commencer, pouvez-vous vous présenter ?","Merci. Parlez-moi un peu de votre famille.","Que faites-vous dans la vie ? Vous travaillez ou vous étudiez ?","Qu'est-ce que vous aimez faire pendant votre temps libre ?","Pouvez-vous décrire la ville où vous habitez ?","Pourquoi apprenez-vous le français ?","Quels sont vos projets pour les prochaines années ?","Merci beaucoup, l'entretien est terminé."],
 convaincre:["Ah bon ? Je ne sais pas trop… Pourquoi est-ce que je devrais venir avec toi ?","Hmm, mais ça doit coûter cher, non ?","Le problème, c'est que je n'ai vraiment pas le temps en ce moment.","Et si ça ne me plaît pas ? Je ne connais personne là-bas.","Je ne suis pas sûr que ce soit vraiment utile pour moi…","Bon… tu marques des points. D'accord, je vais essayer. Merci de m'avoir convaincu !"],
 roleplay:["Bonjour, je vous écoute. Qu'est-ce que je peux faire pour vous ?","Je vois. Pouvez-vous m'expliquer un peu plus la situation ?","Hmm, malheureusement ce n'est pas possible comme ça. Vous avez une autre solution ?","D'accord, ça peut marcher. Il y a autre chose ?","Très bien, alors c'est entendu. Merci et bonne journée !"],
 debat:["Merci pour votre présentation. Pouvez-vous me donner un exemple concret ?","Je ne suis pas tout à fait d'accord. Ne pensez-vous pas que votre position est un peu idéaliste ?","Et quelles seraient les conséquences pour les personnes les plus vulnérables ?","Si vous deviez convaincre quelqu'un qui pense le contraire, que lui diriez-vous ?","Merci, nous allons nous arrêter là."],
 monologue:["Je vous écoute.","Pouvez-vous développer cette idée ?","Avez-vous un exemple ?","Merci."]
};
function exrScriptedAnswer(q,turn){
 const s=strip(String(q||"").toLowerCase());
 const rules=[[/combien|prix|cout|coute|tarif|payer|cher/,"C'est quarante-cinq dollars par personne, et il y a une réduction de dix pour cent pour les étudiants."],[/quand|heure|horaire|jour|date|debut|commence/,"Ça a lieu tous les samedis, de neuf heures à midi, à partir du 15 du mois prochain."],[/ou |adresse|lieu|endroit|situe/,"C'est au 250, rue Principale, à cinq minutes à pied du métro."],[/inscri|reserv|place/,"Vous pouvez vous inscrire en ligne sur notre site ou par téléphone. Il reste encore quelques places."],[/combien de temps|duree|dure/,"Chaque séance dure trois heures, avec une pause de quinze minutes."],[/apporter|materiel|besoin|equipement/,"Tout le matériel est fourni. Apportez simplement une bouteille d'eau et une tenue confortable."],[/enfant|age|ans/,"C'est ouvert à tout le monde à partir de douze ans. Les enfants doivent être accompagnés."],[/parking|stationn|voiture|transport/,"Il y a un stationnement gratuit derrière le bâtiment."],[/annul|rembours/,"Vous pouvez annuler jusqu'à quarante-huit heures avant, et vous êtes remboursé entièrement."],[/combien de personnes|groupe|participants/,"Les groupes sont de douze personnes au maximum."]];
 for(const [re,a] of rules)if(re.test(s))return a;
 return turn>9?"Merci pour votre appel ! N'hésitez pas à rappeler si vous avez d'autres questions. Au revoir !":["Bonne question ! Oui, c'est tout à fait possible.","Alors… je dirais que oui, mais il faut le préciser au moment de l'inscription.","Tout à fait. Avez-vous d'autres questions ?"][turn%3];
}
function exrPrompt(t,mode,msgs){
 const ex=EXAMS[t.exam||P.exam],lv=t.level||examLevel();
 return `Tu joues l'examinateur ou l'interlocuteur dans l'épreuve d'expression orale du ${ex.name} (niveau ${lv}).
Consigne donnée au candidat : ${t.prompt}
Ton rôle : ${EXR_ROLE[mode]}
Règles : réponds UNIQUEMENT par ta prochaine réplique, en français oral naturel, 1 à 3 phrases courtes adaptées au niveau ${lv}. Ne corrige pas le candidat, ne donne ni note ni conseil, ne sors jamais du rôle, n'écris pas le nom des personnages. Après environ ${mode==="entretien"?7:10} échanges, conclus poliment.
${msgs.length?"Conversation jusqu'ici :\n"+msgs.map(m=>(m.r==="x"?"Examinateur : ":"Candidat : ")+m.t).join("\n"):"La conversation n'a pas encore commencé : donne la première réplique."}
Ta prochaine réplique :`;
}
async function exrNext(t,mode,msgs){
 const turn=msgs.filter(m=>m.r==="c").length;
 if(aiAvailable()){try{const r=await aiCall(exrPrompt(t,mode,msgs),{tier:"quick"});const line=String(r||"").replace(/^(Examinateur|Examinatrice|Interlocuteur)\s*:\s*/i,"").trim();if(line)return line;}catch(e){if(e&&e.code==="rate_limited")toast("AI quá tải, giám khảo chuyển sang kịch bản có sẵn.");}}
 if(mode==="questions")return turn===0?"Allô, bonjour ! Oui, c'est bien moi. Je vous écoute.":exrScriptedAnswer(msgs[msgs.length-1].t,turn);
 const sc=EXR_SCRIPT[mode]||EXR_SCRIPT.monologue;return sc[Math.min(turn,sc.length-1)];
}
/* Khung hội thoại với giám khảo, gắn vào một phần tử */
function examinerPanel(host,t,mode,state){
 state.msgs=state.msgs||[];
 const draw=()=>{
  host.innerHTML=`<div class="chat" id="chat-log" aria-live="polite">${state.msgs.length?state.msgs.map(m=>`<div class="msg ${m.r==="x"?"mx":"mc"}"><span class="who">${m.r==="x"?"Examinateur":"Vous"}</span><div class="fr">${esc(m.t)}</div>${m.r==="x"&&HAS_TTS?`<button class="linkbtn say" data-say="${esc(m.t)}" aria-label="Réécouter">${icon("speaker")}</button>`:""}</div>`).join(""):`<p class="muted" style="margin:0;font-size:14px">${esc(EO_MODE_INFO[mode][1])}</p>`}${state.busy?`<div class="msg mx"><span class="who">Examinateur</span><div class="typing"><i></i><i></i><i></i></div></div>`:""}</div>
  ${state.msgs.length||mode==="questions"?`<div class="chat-in"><textarea id="chat-text" class="fr" rows="2" lang="fr" placeholder="${mode==="questions"?"Posez votre question…":"Votre réponse…"}" spellcheck="false"></textarea><div class="chat-btns">${micButtonHTML("chat-mic")}<button class="btn sm" id="chat-send">${icon("chev")}Envoyer</button></div></div>`:`<button class="btn" id="chat-start">${icon("mic")}Commencer avec l'examinateur</button>`}
  <p class="muted" style="font-size:12px;margin:6px 0 0">${aiAvailable()?"Examinateur joué par l'IA ("+aiName()+").":"Examinateur en mode scénario (sans IA). "+esc(STANDALONE?"Ajoutez une clé Gemini pour un examinateur qui s'adapte à vos réponses.":"Ouvrez la page dans Claude pour un examinateur IA.")}</p>`;
  const log=$("#chat-log");if(log)log.scrollTop=log.scrollHeight;
  host.querySelectorAll("[data-say]").forEach(b=>b.onclick=()=>speak(b.dataset.say));
  const st=$("#chat-start");if(st)st.onclick=async()=>{state.busy=true;draw();const l=await exrNext(t,mode,state.msgs);state.busy=false;state.msgs.push({r:"x",t:l});draw();speak(l);};
  const ta=$("#chat-text"),sd=$("#chat-send");
  if(ta){ta.onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sd.click();}};bindMic($("#chat-mic"),ta);setTimeout(()=>{try{ta.focus({preventScroll:true});}catch(e){}},50);}
  if(sd)sd.onclick=async()=>{const v=ta.value.trim();if(!v||state.busy)return;stopSpeech();state.msgs.push({r:"c",t:v});state.busy=true;draw();const l=await exrNext(t,mode,state.msgs);state.busy=false;state.msgs.push({r:"x",t:l});draw();speak(l);state.onChange&&state.onChange();};
 };
 draw();return draw;
}
function dialogText(msgs){return msgs.map(m=>(m.r==="x"?"Examinateur : ":"Candidat : ")+m.t).join("\n");}
function candidateText(msgs){return msgs.filter(m=>m.r==="c").map(m=>m.t).join("\n");}

/* ===== Luyện nói (thay bản cũ): giám khảo ảo + ghi âm + chấm ===== */
function openSpeaking(t){
 if(!t)return;openOverlay();
 const ex=EXAMS[t.exam||P.exam],mode=eoMode(t),info=EO_MODE_INFO[mode],interactive=mode!=="monologue";
 const state={msgs:[]};
 $("#overlay").innerHTML=`<div class="ov-top"><button class="x" id="s-close" aria-label="Fermer">${icon("x")}</button><div style="flex:1;min-width:0"><div class="eyebrow">${esc(ex.name)} · Expression orale · ${esc(info[0])}</div><b>${esc(t.title)}</b></div><span class="timer" id="s-timer-box">${icon("clock")}<span id="s-timer" class="tnum">${fmtTime((t.prep||t.mins)*60)}</span></span></div>
 <div class="ov-body"><div class="ov-inner wide" style="display:flex;flex-direction:column;gap:14px">
  <div class="card"><div class="eyebrow" style="display:flex;justify-content:space-between;align-items:center">Consigne ${HAS_TTS?`<button class="linkbtn" id="s-read">${icon("speaker")} Écouter la consigne</button>`:""}</div><p class="fr" style="font-size:16px;margin:6px 0 0">${esc(t.prompt)}</p><p class="muted" style="font-size:13px;margin:8px 0 0">${t.prep?"Préparation : "+t.prep+" min · ":"Sans préparation · "}Durée : ${fmtTime(t.mins*60)}</p></div>
  <details class="card"><summary style="cursor:pointer;font-weight:700">Plan conseillé</summary><ol class="plan">${t.plan.map(x=>`<li>${esc(x)}</li>`).join("")}</ol></details>
  ${mode==="debat"||mode==="monologue"?`<div class="card"><div class="eyebrow">${mode==="debat"?"Partie 1 · Votre monologue":"Votre production"}</div><textarea class="essay fr" id="s-text" lang="fr" style="min-height:160px;margin-top:8px" placeholder="${micUsable()?"Appuyez sur Ghi âm et parlez : le texte s'affiche ici. Vous pouvez aussi écrire ce que vous avez dit.":"Écrivez ici ce que vous avez dit (transcription)."}" spellcheck="false">${esc(getDraft(t.id))}</textarea><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:8px">${micButtonHTML("s-mic")}</div></div>`:""}
  ${interactive?`<div class="card"><div class="eyebrow">${mode==="debat"?"Partie 2 · Débat avec l'examinateur":"Dialogue avec l'examinateur"}</div><div id="exr"></div></div>`:""}
  ${gradeSlot()}
 </div></div>
 <div class="ov-foot"><div class="in"><button class="btn ghost" id="s-go">${icon("clock")}${t.prep?"Préparer":"Démarrer le chrono"}</button><button class="btn" id="s-grade">${icon("spark")}Évaluer ma production</button></div></div>`;
 const ta=$("#s-text");let st;if(ta){ta.oninput=()=>{clearTimeout(st);st=setTimeout(()=>setDraft(t.id,ta.value),400);};bindMic($("#s-mic"),ta);}
 if(interactive)examinerPanel($("#exr"),t,mode,state);
 const textOf=()=>[ta?ta.value.trim():"",candidateText(state.msgs)].filter(Boolean).join("\n");
 $("#s-close").onclick=()=>{if(ta)setDraft(t.id,ta.value);if(wordCount(textOf())>=30){planMark("EO");award(15);save();}stopSpeech();closeOverlay();};
 const sr=$("#s-read");if(sr)sr.onclick=()=>speak(t.prompt);
 let phase=t.prep?"prep":"speak";
 $("#s-go").onclick=e=>{
  const b=e.currentTarget;b.disabled=true;OVT.forEach(clearInterval);OVT=[];
  const startSpeak=()=>{countdown($("#s-timer"),t.mins*60,()=>toast("Temps écoulé ! Terminez votre phrase."));b.innerHTML=icon("clock")+"En cours";};
  if(phase==="prep"){countdown($("#s-timer"),t.prep*60,()=>{phase="speak";toast("Fin de la préparation. À vous !");startSpeak();});b.innerHTML=icon("clock")+"Préparation…";const sk=document.createElement("button");sk.className="btn ghost";sk.textContent="Parler maintenant";sk.onclick=()=>{OVT.forEach(clearInterval);OVT=[];phase="speak";sk.remove();startSpeak();};b.after(sk);}
  else startSpeak();
 };
 $("#s-grade").onclick=()=>{const txt=textOf();if(ta)setDraft(t.id,ta.value);if(wordCount(txt)>=30){planMark("EO");save();}runGrade($(".g-slot"),t,txt,"EO",{dialog:state.msgs.length?((ta&&ta.value.trim()?"Candidat (monologue) : "+ta.value.trim()+"\n":"")+dialogText(state.msgs)):""});};
}
/* ===== Thi thử đúng cấu trúc đề thật (TCF Canada, TEF Canada, DELF, DALF) ===== */
const LVN={A1:1,A2:2,B1:3,B2:4,C1:5,C2:6};
const TCF_PTS={A1:3,A2:9,B1:15,B2:21,C1:26,C2:33};
const MOCK_SPEC={
 tcf:{prog:true,plays:1,order:["CO","CE","EE","EO"],CO:{n:39,min:35},CE:{n:39,min:60},EE:{min:60,tasks:[/^tcf-t1/,/^tcf-t2/,/^tcf-t3/]},EO:{parts:[/^tcf-eo1/,/^tcf-eo2/,/^tcf-eo3/],min:12}},
 tef:{prog:true,plays:1,order:["CE","CO","EE","EO"],CE:{n:40,min:60},CO:{n:40,min:40},EE:{min:60,tasks:[/^tef-a/,/^tef-b/]},EO:{parts:[/^tef-eoa/,/^tef-eob/],min:15}},
 delf:{prog:false,plays:2,order:["CO","CE","EE","EO"],byLv:{A1:{CO:[4,20],CE:[4,30],EE:30,EO:7},A2:{CO:[4,25],CE:[4,30],EE:45,EO:8},B1:{CO:[3,25],CE:[3,45],EE:45,EO:15},B2:{CO:[3,30],CE:[3,60],EE:60,EO:20}}},
 dalf:{prog:false,plays:2,order:["CO","CE","EE","EO"],byLv:{C1:{CO:[3,40],CE:[2,50],EE:150,EO:30},C2:{CO:[2,30],CE:[2,60],EE:210,EO:30}}}
};
const DIST39=[4,6,9,9,7,4],DIST40=[4,6,9,10,7,4],DIST12=[1,2,3,3,2,1];
function itemLv(it,b){return it.lvx||["A2","B1","C1"][b];}
function pickRot(list,seed){return list.length?list[seed%list.length]:null;}
/* Câu hỏi đơn lẻ, khó dần (TCF/TEF) */
function progItems(k,n){
 const dist=n===39?DIST39:n===40?DIST40:DIST12,used=new Set(),docUsed=new Set(),out=[];
 const pool=[0,1,2].flatMap(b=>BANK[k][b].map(it=>({it,lv:itemLv(it,b),b})));
 LEVELS.forEach((L,li)=>{
  let need=dist[li];
  const exact=shuffle(pool.filter(x=>x.lv===L&&x.it.doc!=null)),band=shuffle(pool.filter(x=>x.it.doc==null&&x.b===(li<2?0:li<4?1:2)));
  for(const src of [exact,band])for(const x of src){if(!need)break;if(used.has(x.it.id))continue;if(x.it.doc!=null){if(docUsed.has(x.it.doc))continue;docUsed.add(x.it.doc);}used.add(x.it.id);out.push({lv:L,it:x.it});need--;}
 });
 return out.map(x=>({single:true,lv:x.lv,title:x.it.dtitle||"",type:x.it.dtype||"",say:x.it.say,text:x.it.text,qs:[mkQ(x.it,x.lv)]}));
}
function mkQ(it,lv){const p=prep(it);p.sel=null;p.lvq=lv;return p;}
/* Tài liệu nhiều câu (DELF/DALF) */
function docGroups(k,lv,nDocs){
 const docs=shuffle(XDOCS.map((d,di)=>({d,di})).filter(x=>x.d.k===k&&x.d.lv===lv)).slice(0,nDocs);
 const all=[0,1,2].flatMap(b=>BANK[k][b]);
 const groups=docs.map(({d,di})=>({title:d.title,type:d.type,lv,say:k==="CO"?d.text:null,text:k==="CE"?d.text:null,qs:all.filter(it=>it.doc===di).sort((a,b)=>a.qi-b.qi).map(it=>mkQ(it,lv))}));
 if(groups.length<nDocs){const b=LVN[lv]<=2?0:LVN[lv]<=4?1:2;shuffle(BANK[k][b].filter(it=>it.doc==null)).slice(0,(nDocs-groups.length)*3).forEach(it=>groups.push({single:true,title:"",type:"Document court",lv,say:it.say,text:it.text,qs:[mkQ(it,lv)]}));}
 return groups;
}
function tasksByRe(bank,re){return bank.filter(t=>re.test(t.id));}
function delfEOParts(lv){
 const pool=EO_BANK.filter(t=>(t.exam==="delf"||t.exam==="dalf")&&t.level===lv),seed=P.history.length;
 const inter=pool.filter(t=>t.plan===PLANS.inter||t.plan===PLANS.dlg),mono=pool.filter(t=>t.plan===PLANS.mono||t.plan===PLANS.pdv||t.plan===PLANS.expo);
 const ent={id:"delf-ent-"+lv,exam:"delf",level:lv,title:"Entretien dirigé",prep:0,mins:lv<"B1"?2:3,prompt:"Présentez-vous et répondez aux questions de l'examinateur sur vous, votre famille, vos activités, vos goûts et vos projets.",plan:PLANS.tcf1};
 if(lv[0]==="C")return [pickRot(mono.length?mono:pool,seed)].filter(Boolean);
 return [ent,pickRot(inter,seed),pickRot(mono,seed+1)].filter(Boolean);
}
function mockPlan(short){
 const ex=EXAMS[P.exam],lv=examLevel(),sp=MOCK_SPEC[P.exam]||MOCK_SPEC.tcf,seed=P.history.length;
 const secs={};
 if(sp.prog){
  ["CO","CE"].forEach(k=>{const n=short?12:sp[k].n,min=short?Math.round(sp[k].min*12/sp[k].n):sp[k].min;secs[k]={n,min};});
  let ee=sp.EE.tasks.map(re=>pickRot(tasksByRe(EE_BANK,re),seed)).filter(Boolean),eo=sp.EO.parts.map((re,i)=>pickRot(tasksByRe(EO_BANK,re),seed+i)).filter(Boolean);
  if(short){ee=ee.slice(0,1);eo=eo.slice(1,2);}
  secs.EE={tasks:ee,min:short?ee[0].mins:sp.EE.min};secs.EO={parts:eo,min:short?eo[0].mins+(eo[0].prep||0):sp.EO.min};
 }else{
  const b=sp.byLv[lv]||sp.byLv[Object.keys(sp.byLv)[0]];
  ["CO","CE"].forEach(k=>{const nd=short?Math.max(1,b[k][0]-1):b[k][0];secs[k]={docs:nd,min:short?Math.round(b[k][1]*nd/b[k][0]):b[k][1]};});
  const pool=EE_BANK.filter(t=>t.exam===P.exam&&t.level===lv);
  let ee=P.exam==="dalf"&&lv==="C1"?[pickRot(pool.filter(t=>/c1s/.test(t.id)),seed),pickRot(pool.filter(t=>/c1e/.test(t.id)),seed)].filter(Boolean):[pickRot(pool,seed)].filter(Boolean);
  let eo=delfEOParts(lv);if(short){ee=ee.slice(0,1);eo=eo.slice(1,2).length?eo.slice(1,2):eo.slice(0,1);}
  secs.EE={tasks:ee,min:short&&ee[0]?ee[0].mins:b.EE};secs.EO={parts:eo,min:b.EO};
 }
 const order=sp.order.filter(k=>k==="EE"?secs.EE.tasks.length:k==="EO"?secs.EO.parts.length:true);
 const total=Math.round(order.reduce((a,k)=>a+(secs[k].min||0),0));
 const nq=k=>secs[k].n?secs[k].n+" câu":secs[k].docs+" tài liệu";
 return {short,order,secs,lv,total,desc:`${short?"Bản rút gọn: ":"Đúng cấu trúc đề thật: "}${order.map(k=>k+" ("+(k==="EE"?secs.EE.tasks.length+" bài":k==="EO"?secs.EO.parts.length+" phần":nq(k))+", "+secs[k].min+" phút)").join(" · ")}.${sp.prog?" Câu hỏi khó dần từ A1 đến C2, mỗi bài nghe chỉ được nghe "+sp.plays+" lần như đề thật.":" Mỗi bài nghe được nghe "+sp.plays+" lần."}`};
}
function startMock(short){
 const pl=mockPlan(!!short),sp=MOCK_SPEC[P.exam]||MOCK_SPEC.tcf,lv=pl.lv;
 const name={CO:"Compréhension orale",CE:"Compréhension écrite",EE:"Expression écrite",EO:"Expression orale"};
 const sections=pl.order.map(k=>{
  const s=pl.secs[k],base={k,name:name[k],time:s.min*60};
  if(k==="CO"||k==="CE"){const groups=sp.prog?progItems(k,s.n):docGroups(k,lv,s.docs);groups.forEach(g=>{g.plays=0;});return Object.assign(base,{groups});}
  if(k==="EE")return Object.assign(base,{tasks:s.tasks.map(t=>({t,text:""}))});
