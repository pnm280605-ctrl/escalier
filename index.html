*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background-color:var(--bg);background-image:var(--pattern-cat),var(--pattern);background-size:180px 180px,180px 180px;background-position:0 0,40px 30px;color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance;letter-spacing:.005em}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
button:focus-visible,a:focus-visible,textarea:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:12px}
a{color:var(--blue)}
.fr{font-family:var(--f-body)}
.muted{color:var(--muted)}
.tnum{font-variant-numeric:tabular-nums}
.ico{width:1.25em;height:1.25em;flex:none;display:inline-block;vertical-align:-.2em}

/* App frame */
.app{display:grid;grid-template-columns:232px minmax(0,1fr) 330px;min-height:100%;max-width:1320px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));gap:28px}
.side{position:sticky;top:0;height:100vh;padding-block:22px;display:flex;flex-direction:column;gap:6px;border-right:2px solid var(--line);padding-right:16px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px}
.brand b{font-family:var(--f-display);font-size:26px;font-weight:800;color:var(--blue);letter-spacing:-.01em;line-height:1}
.brand small{display:block;font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.nav-btn{display:flex;align-items:center;gap:14px;padding:11px 14px;border-radius:14px;border:2px solid transparent;font-weight:700;font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left}
.nav-btn .ico{width:28px;height:28px}
.nav-btn:hover{background:var(--surface-2)}
.nav-btn[aria-current="page"]{background:var(--blue-soft);border-color:var(--blue);color:var(--blue)}
.main{min-width:0;padding-block:18px 120px}
.rail{position:sticky;top:0;height:100vh;overflow:auto;padding-block:22px;display:flex;flex-direction:column;gap:16px}

/* Top bar */
.topbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;border:2px solid var(--line);background:var(--surface);font-weight:700;font-size:14px;box-shadow:0 3px 0 var(--line)}
.chip:hover{background:var(--surface-2)}
.chip .lv{font-family:var(--f-display);font-size:16px}
.stats{display:flex;align-items:center;gap:14px;margin-left:auto}
.stat{display:inline-flex;align-items:center;gap:5px;font-weight:800;font-family:var(--f-display);font-size:18px}
.stat.fire{color:var(--gold-d)} .stat.gem{color:var(--blue)} .stat.dim{color:var(--lock-d)}
.mobile-only{display:none}

/* Cards */
.card{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:18px}
.card h3{font-size:20px;margin-bottom:6px}
.card-row{display:flex;align-items:center;gap:14px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}

/* Buttons */
.btn{--c:var(--blue);--cd:var(--blue-d);display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:14px;background:var(--c);color:var(--on);font-weight:800;font-size:15px;letter-spacing:.06em;text-transform:uppercase;box-shadow:0 4px 0 var(--cd);transition:transform .06s,box-shadow .06s,filter .15s;min-height:48px}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--cd)}
.btn.green{--c:var(--green);--cd:var(--green-d)}
.btn.red{--c:var(--red);--cd:var(--red-d)}
.btn.gold{--c:var(--gold);--cd:var(--gold-d);color:var(--on-gold)}
.btn.ghost{--c:var(--surface);--cd:var(--line);color:var(--blue);border:2px solid var(--line)}
.btn[disabled]{--c:var(--lock);--cd:var(--lock-d);color:var(--muted);cursor:not-allowed;filter:none}
.btn.wide{width:100%}
.btn.sm{padding:8px 14px;min-height:38px;font-size:13px}
.linkbtn{color:var(--blue);font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase}

/* Learning path */
.unit-head{border-radius:var(--r);padding:16px 18px;color:var(--on);background:var(--lc);box-shadow:0 4px 0 var(--lcd);display:flex;align-items:center;gap:14px;margin:8px 0 62px}
.unit-head .eyebrow{color:var(--on);opacity:.85}
.unit-head h2{font-size:22px}
.unit-head button{margin-left:auto;border:2px solid rgba(255,255,255,.45);border-radius:12px;padding:8px 12px;font-weight:800;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--on);display:inline-flex;gap:6px;align-items:center;flex:none}
.unit-head button:hover{background:rgba(255,255,255,.14)}
.path{display:flex;flex-direction:column;align-items:center;gap:22px;margin-bottom:44px}
.node-wrap{position:relative;transform:translateX(var(--x,0))}
.node{width:76px;height:70px;border-radius:50%;display:grid;place-items:center;background:var(--lc);box-shadow:0 7px 0 var(--lcd);color:var(--on);transition:transform .08s,box-shadow .08s}
.node .ico{width:34px;height:34px}
.node:active{transform:translateY(6px);box-shadow:0 1px 0 var(--lcd)}
.node.locked{background:var(--lock);box-shadow:0 7px 0 var(--lock-d);color:var(--muted)}
.node.done{background:var(--gold);box-shadow:0 7px 0 var(--gold-d);color:var(--on-gold)}
.node.current{outline:6px solid color-mix(in srgb,var(--lc) 28%,transparent);outline-offset:6px}
.node.chest{border-radius:22px}
.vsel{max-width:100%;min-width:0;width:260px;border:2px solid var(--line);border-radius:12px;padding:8px 10px;background:var(--surface);color:var(--fg);font:inherit;font-size:14px}
.tcard{display:flex;gap:14px;align-items:center;background:var(--surface);border:2px solid var(--lc);border-radius:var(--r);padding:14px 16px;margin:0 0 22px;box-shadow:0 4px 0 var(--lcd)}
.tcard.ok{border-color:var(--line);box-shadow:0 4px 0 var(--line)}
.tc-ic{width:46px;height:46px;border-radius:14px;background:var(--lc);color:var(--on);display:grid;place-items:center;flex:none}
.tcard.ok .tc-ic{background:var(--gold);color:var(--on-gold)}
.tc-ic .ico{width:26px;height:26px}
.tc-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.tc-body b{font-family:var(--f-display);font-size:18px}
.tc-body span{font-size:13px;color:var(--muted);line-height:1.45}
.tcard .btn{flex:none}
@media (max-width:520px){.tcard{flex-wrap:wrap}.tcard .btn{width:100%}}
.trules{margin:6px 0 14px;padding-left:20px;line-height:1.65;font-size:14.5px}
.thist{margin:4px 0 16px;padding-left:20px;font-size:14px;line-height:1.9}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:8px;max-height:50vh;overflow:auto;padding:2px}
.tgrid button{height:42px;border-radius:10px;border:2px solid var(--line);background:var(--surface);font-weight:700;color:var(--muted)}
.tgrid button.on{background:var(--pink-soft);border-color:var(--pink);color:var(--fg)}
.tgrid button.cur{outline:3px solid var(--blue);outline-offset:1px}
.tnav-btn{border:2px solid var(--line);border-radius:12px;padding:6px 10px;font-weight:800;font-size:13px;color:var(--fg);background:var(--surface);flex:none}
.tres{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.tres.ok{border-color:var(--green)}
.tbar{position:relative;height:14px;border-radius:99px;background:var(--surface-2);margin-top:8px;overflow:visible}
.tbar i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--red)}
.tres.ok .tbar i{background:var(--green)}
.tbar em{position:absolute;top:-4px;bottom:-4px;width:3px;border-radius:2px;background:var(--fg);transform:translateX(-50%)}
.weak{margin:6px 0 0;padding-left:20px;line-height:1.8;font-size:14.5px}
.vtabs{margin:0 0 16px;flex-wrap:wrap}
.vtabs button{display:inline-flex;align-items:center;gap:4px}
.vtabs button:disabled{opacity:.45;cursor:not-allowed}
.vstats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}
.vstats .card{padding:12px 14px}
.vstats h3{font-size:26px;margin:2px 0 0}
.vactions{display:flex;gap:10px;flex-wrap:wrap}
@media (max-width:760px){.vstats{grid-template-columns:repeat(2,minmax(0,1fr))}.vactions .btn{flex:1 1 100%}}
.fc{background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:28px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:10px;box-shadow:0 4px 0 var(--line)}
.fc-word{font-size:34px;font-weight:700;line-height:1.2;overflow-wrap:anywhere}
.fc-back{border-top:2px dashed var(--line);padding-top:14px;margin-top:8px;width:100%;display:flex;flex-direction:column;gap:8px}
.fc-vi{font-family:var(--f-display);font-size:26px;font-weight:800;color:var(--blue)}
.fc-ex{font-size:16px;color:var(--muted);font-style:italic}
.gtag{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);vertical-align:2px}
.gtag.g-m{background:var(--blue-soft);color:var(--blue-d)}
.gtag.g-f{background:var(--pink-soft);color:var(--pink-d)}
.wlist{display:flex;flex-direction:column;max-height:55vh;overflow:auto;margin:10px 0 0;border:2px solid var(--line);border-radius:14px}
.wrow2{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-top:1px solid var(--line)}
.wrow2:first-child{border-top:0}
.wspk{width:34px;height:34px;border-radius:10px;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;flex:none}
.wspk .ico{width:18px;height:18px}
.wtxt{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.wtxt b{font-size:16px}
@media (hover:none){.nav-btn:not([aria-current="page"]):hover{background:transparent}}
.wtxt span:not(.gtag){font-size:14px;color:var(--muted)}
.wtxt em{font-size:13px;color:var(--muted)}
.wst{width:10px;height:10px;border-radius:50%;background:var(--lock-d);display:inline-block;flex:none;margin-top:12px}
p .wst{margin:0 2px 0 6px;vertical-align:0}
.wst.known{background:var(--green)} .wst.learning{background:var(--gold)}
/* Trò chơi */
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.game{display:flex;flex-direction:column;gap:8px;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:0 4px 0 var(--line);transition:transform .06s}
.game:hover{border-color:var(--gc)}
.game:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.game .g-ic{width:42px;height:42px;border-radius:12px;background:var(--gc);color:#fff;display:grid;place-items:center}
.game .g-ic .ico{width:24px;height:24px}
.game .g-t b{display:block;font-family:var(--f-display);font-size:18px;line-height:1.2}
.game .g-t small{color:var(--muted);font-weight:700;font-size:12px}
.game .g-d{font-size:13px;color:var(--muted)}
.game .tag{align-self:flex-start}
.race{display:flex;flex-direction:column;gap:14px}
.race-bar{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.race-bar i{display:block;height:100%;width:100%;background:var(--gold);transition:width .1s linear}
.race-q{font-size:22px;font-weight:700;text-align:center;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:18px 14px;line-height:1.4}
.race-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.race-opt{min-height:88px;border-radius:14px;color:#fff;font-weight:700;font-size:16px;display:flex;align-items:center;gap:10px;padding:12px 14px;text-align:left;box-shadow:0 5px 0 rgba(0,0,0,.22)}
.race-opt .shp{font-size:22px;flex:none}
.race-opt.c0{background:#D2384E}.race-opt.c1{background:#2F6FC4}.race-opt.c2{background:#C98A06}.race-opt.c3{background:#3E8424}
.race-opt.dim{opacity:.35}.race-opt.right{outline:4px solid var(--fg);outline-offset:2px}
.race-opt:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.22)}
.race-score{text-align:center;color:var(--muted)}
.race-res{display:flex;flex-direction:column;gap:8px;border-radius:16px;padding:14px 16px;background:var(--surface);border:2px solid var(--line)}
.race-res.ok{border-color:var(--green);background:var(--green-soft)}.race-res.bad{border-color:var(--red);background:var(--red-soft)}
.board{margin:4px 0;padding-left:22px;display:flex;flex-direction:column;gap:4px}
.board li{display:flex;justify-content:space-between;gap:10px}
.board li.me{font-weight:800;color:var(--blue-d)}
@media (max-width:520px){.race-grid{grid-template-columns:1fr}.race-opt{min-height:62px}}
.pairs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.pcard{aspect-ratio:1/1.05;border-radius:12px;background:var(--pink);color:var(--on-pink);font-weight:800;font-size:22px;display:grid;place-items:center;padding:6px;box-shadow:0 4px 0 var(--pink-d);overflow:hidden;overflow-wrap:anywhere;line-height:1.2}
.pcard.up{background:var(--surface);color:var(--fg);border:2px solid var(--line);font-size:13px;font-weight:700;box-shadow:0 3px 0 var(--line)}
.pcard.up.fr{color:var(--blue-d)}
.pcard.ok{background:var(--green-soft);border-color:var(--green);opacity:.75}
.scr-line{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:6px 0 22px}
.scr-line .slot{width:38px;height:46px;border-bottom:3px solid var(--blue);display:grid;place-items:center;font-size:22px;font-weight:700}
.scr-line.ok .slot{border-color:var(--green);color:var(--green-d)}.scr-line.bad .slot{border-color:var(--red);color:var(--red-d)}
.tf{display:flex;flex-direction:column;gap:18px}
.tf-card{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:26px 16px;text-align:center;display:flex;flex-direction:column;gap:6px}
.tf-fr{font-size:28px;font-weight:700}.tf-eq{color:var(--muted)}.tf-vi{font-size:22px;font-family:var(--f-display);font-weight:800;color:var(--pink-d)}
.tf-btns{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tf-btns .btn{min-height:64px;font-size:18px}
.duel-score{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.duel-score>div{display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:10px 16px;min-width:110px}
.duel-score .tnum{font-family:var(--f-display);font-size:28px;font-weight:800}
.duel-score em{font-size:12px;color:var(--muted);font-style:normal}
/* Giám khảo ảo */
.chat{display:flex;flex-direction:column;gap:10px;max-height:46vh;overflow:auto;padding:4px 2px 8px;margin-top:8px}
.msg{max-width:88%;border-radius:16px;padding:10px 12px;position:relative;display:flex;flex-direction:column;gap:2px}
.msg.mx{background:var(--surface-2);align-self:flex-start;border-bottom-left-radius:4px;padding-right:36px}
.msg.mc{background:var(--blue-soft);align-self:flex-end;border-bottom-right-radius:4px}
.msg .who{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.msg .say{position:absolute;right:8px;top:6px}
.typing{display:flex;gap:4px;padding:6px 0}.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:bob 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
.chat-in{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.chat-in textarea{width:100%;border:2px solid var(--line);border-radius:14px;background:var(--surface);color:var(--fg);padding:10px 12px;font:inherit;font-size:16px;resize:vertical}
.chat-btns{display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.mic.rec{background:var(--red);color:#fff;border-color:var(--red);animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--red) 30%,transparent)}}
.mic-note{font-size:12.5px;display:inline-flex;gap:6px;align-items:center}
/* Thi thử */
.mk-intro{display:flex;flex-direction:column;gap:4px;background:var(--blue-soft);border-color:transparent}
.mk-q{display:flex;flex-direction:column;gap:8px;border-top:1px dashed var(--line);padding-top:10px}
.mk-play{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.mk-scores{display:flex;gap:16px;flex-wrap:wrap;margin-top:6px}.mk-scores>div{display:flex;flex-direction:column}
.mk-scores b{font-family:var(--f-display);font-size:22px}
.rv{display:flex;flex-direction:column;gap:4px;border-left:4px solid var(--green);padding:6px 10px;border-radius:0 10px 10px 0;background:var(--surface-2)}
.rv.bad{border-color:var(--red)}
.why{font-size:13.5px;color:var(--muted);display:flex;gap:6px;align-items:flex-start}
.why .ico{flex:none;margin-top:2px;color:var(--gold-d)}
p.why{margin:6px 0 0}
details.rule{margin-top:6px;font-size:14px}details.rule summary{cursor:pointer;font-weight:700;color:var(--blue-d)}details.rule div{background:var(--surface);border-radius:10px;padding:8px 10px;margin-top:6px;line-height:1.6;max-height:160px;overflow:auto}
.nat{display:flex;flex-direction:column;gap:8px}.nat>div{display:flex;flex-direction:column;gap:2px;border-left:4px solid var(--blue);background:var(--blue-soft);padding:8px 12px;border-radius:0 10px 10px 0;font-size:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
/* Tài khoản */
.acct{display:flex;flex-direction:column;gap:2px;margin-bottom:12px}
.acct-ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--surface-2);color:var(--muted);flex:none}.acct-ic.ok{background:var(--green-soft);color:var(--green-d)}
.acct-form{display:flex;flex-direction:column;gap:8px}
.acct-form input{border:2px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;font-size:16px;background:var(--surface);color:var(--fg)}
.nlabel{position:absolute;top:50%;transform:translateY(-50%);width:max-content;max-width:min(170px,calc(50vw - 78px));display:flex;flex-direction:column;gap:1px;line-height:1.25;pointer-events:none;background:color-mix(in srgb,var(--bg) 82%,transparent);padding:4px 8px;border-radius:10px}
.nlabel.r{left:calc(100% + 14px)}
.nlabel.l{right:calc(100% + 14px);text-align:right}
.nlabel b{font-size:13.5px;color:var(--fg);font-weight:700;overflow-wrap:anywhere}
.nlabel small{font-size:11.5px;color:var(--muted)}
.nlabel.locked b{color:var(--muted)}
.unit-goal{margin:4px 0 0;font-size:13.5px;opacity:.9;line-height:1.45}
.tipbox{background:var(--surface-2,var(--bg));border:2px solid var(--line);border-radius:14px;padding:12px 14px;font-size:15px;line-height:1.75;margin:10px 0 16px}
.tiplist{display:flex;flex-direction:column;gap:8px;margin:8px 0 16px;max-height:55vh;overflow:auto}
.tiplist summary{cursor:pointer;font-weight:700;padding:8px 2px}
.tiplist .tipbox{margin:4px 0 6px}
.bubble{position:absolute;left:50%;bottom:calc(100% + 16px);transform:translateX(-50%);background:var(--surface);border:2px solid var(--line);color:var(--lc);font-family:var(--f-display);font-weight:800;padding:6px 14px;border-radius:12px;white-space:nowrap;animation:bob 1.6s ease-in-out infinite;font-size:15px;letter-spacing:.04em}
.bubble::after{content:"";position:absolute;left:50%;top:100%;width:12px;height:12px;background:var(--surface);border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:translate(-50%,-6px) rotate(45deg)}
@keyframes bob{50%{transform:translate(-50%,-5px)}}
.level-hero{display:flex;gap:16px;align-items:center;margin-bottom:22px}
.level-badge{font-family:var(--f-display);font-weight:800;font-size:30px;width:72px;height:72px;border-radius:20px;display:grid;place-items:center;background:var(--lc);color:var(--on);box-shadow:0 5px 0 var(--lcd);flex:none}
.level-hero h1{font-size:28px}
.level-hero p{margin:4px 0 0;color:var(--muted);max-width:52ch}
.prog{height:14px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.prog>i{display:block;height:100%;border-radius:inherit;background:var(--green);transition:width .35s ease}

/* Rail */
.ring{--p:0;width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--gold) calc(var(--p)*1%),var(--surface-2) 0);display:grid;place-items:center;flex:none}
.ring span{width:48px;height:48px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:15px}
.mini-list{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.mini-list div{display:flex;justify-content:space-between;gap:10px;font-size:13px;border-top:1px solid var(--line);padding-top:8px}
.mini-list b{text-align:right}

/* Bottom nav (phone) */
.bottom{display:none}

/* Practice & exam */
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.skill{display:flex;flex-direction:column;gap:10px;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:0 4px 0 var(--line);transition:transform .06s}
.skill:hover{border-color:var(--sc)}
.skill:disabled{opacity:.5;cursor:not-allowed}
.skill:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.skill .sk-ico{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--sc);color:var(--on)}
.skill .sk-ico .ico{width:26px;height:26px}
.skill h3{font-size:19px}
.skill p{margin:0;font-size:13px;color:var(--muted)}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.tag.ok{background:var(--green-soft);color:var(--green-d)} .tag.warn{background:var(--gold-soft);color:var(--gold-d)} .tag.bad{background:var(--red-soft);color:var(--red-d)}
:root[data-theme="dark"] .tag.ok,:root[data-theme="dark"] .tag.warn,:root[data-theme="dark"] .tag.bad{color:var(--fg)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tag.ok,:root:not([data-theme="light"]) .tag.warn,:root:not([data-theme="light"]) .tag.bad{color:var(--fg)}}
.section-title{display:flex;align-items:center;justify-content:space-between;gap:10px 12px;margin:26px 0 12px;flex-wrap:wrap}
.section-title h2{font-size:22px}
.table-wrap{overflow-x:auto;border:2px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.fmt{width:100%;border-collapse:collapse;font-size:14px;min-width:520px}
table.fmt th,table.fmt td{padding:11px 14px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
table.fmt tr:last-child td{border-bottom:0}
table.fmt th{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);background:var(--surface-2)}
.code{font-family:var(--f-display);font-weight:800;color:var(--blue);font-size:16px}
.tips{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.task-list{display:flex;flex-direction:column;gap:10px}
.task{display:flex;align-items:center;gap:14px;padding:14px 16px;border:2px solid var(--line);border-radius:14px;background:var(--surface);text-align:left;width:100%}
.task:hover{background:var(--surface-2)}
.task .t-body{min-width:0;flex:1}
.task .t-body b{display:block;font-size:15px}
.task .t-body span{font-size:13px;color:var(--muted)}

/* Overlay: lesson, mock, writing */
.overlay{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
.ov-top{display:flex;align-items:center;gap:16px;padding-top:max(14px,env(safe-area-inset-top,0px));padding-bottom:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1000px;width:100%;margin:0 auto}
.x{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--muted);flex:none}
.x:hover{background:var(--surface-2)}
.ov-top .prog{flex:1}
.hearts{display:inline-flex;align-items:center;gap:5px;color:var(--red);font-weight:800;font-family:var(--f-display);font-size:19px}
.ov-body{flex:1;overflow:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ov-inner{max-width:640px;margin:0 auto;padding-block:18px 40px}
.ov-inner.wide{max-width:860px}
.ov-foot{border-top:2px solid var(--line);background:var(--surface);padding-top:16px;padding-bottom:max(16px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ov-foot .in{max-width:860px;margin:0 auto;display:flex;align-items:center;gap:14px;justify-content:space-between;flex-wrap:wrap}
.ov-foot.ok{background:var(--green-soft);border-color:transparent}
.ov-foot.bad{background:var(--red-soft);border-color:transparent}
.fb{display:flex;gap:14px;align-items:flex-start;min-width:0;flex:1 1 320px}
.fb .badge{width:56px;height:56px;border-radius:50%;background:var(--surface);display:grid;place-items:center;flex:none}
.fb.ok .badge{color:var(--green)} .fb.bad .badge{color:var(--red)}
.fb .badge .ico{width:30px;height:30px}
.fb h3{font-size:22px}
.fb.ok h3{color:var(--green-d)} .fb.bad h3{color:var(--red-d)}
.fb p{margin:4px 0 0;font-size:14px}
.ask-ai{margin-top:8px;font-size:13px;font-weight:700;color:var(--blue);display:inline-flex;gap:6px;align-items:center}
.ai-explain{margin-top:8px;font-size:14px;white-space:pre-wrap;background:var(--surface);border-radius:12px;padding:10px 12px;max-height:180px;overflow:auto}

.q-title{font-size:24px;margin-bottom:18px}
.q-sub{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--blue);margin-bottom:6px}
.sentence{font-size:22px;font-weight:600;margin:4px 0 22px;line-height:1.5}
.blank{display:inline-block;min-width:80px;border-bottom:3px solid var(--blue);text-align:center;color:var(--blue);padding:0 6px}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;padding:13px 14px;border:2px solid var(--line);border-radius:14px;background:var(--surface);box-shadow:0 3px 0 var(--line);font-size:16px;font-weight:600;transition:transform .05s}
.opt .k{width:28px;height:28px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;color:var(--muted);flex:none}
.opt:hover{background:var(--surface-2)}
.opt[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft);box-shadow:0 3px 0 var(--blue);color:var(--blue)}
.opt[aria-pressed="true"] .k{border-color:var(--blue);color:var(--blue)}
.opt.right{border-color:var(--green);background:var(--green-soft);box-shadow:0 3px 0 var(--green)}
.opt.wrong{border-color:var(--red);background:var(--red-soft);box-shadow:0 3px 0 var(--red)}
.opt:disabled{cursor:default}
.passage{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:14px 16px;font-size:16px;line-height:1.7;margin-bottom:18px;white-space:pre-line}
.speaker{display:flex;gap:12px;align-items:center;margin-bottom:22px}
.spk{width:84px;height:84px;border-radius:22px;background:var(--blue);color:var(--on);box-shadow:0 5px 0 var(--blue-d);display:grid;place-items:center}
.spk .ico{width:40px;height:40px}
.spk.slow{width:58px;height:58px;border-radius:16px}
.spk.slow .ico{width:26px;height:26px}
.spk:active{transform:translateY(4px);box-shadow:0 1px 0 var(--blue-d)}
.spk[disabled]{background:var(--lock);box-shadow:0 5px 0 var(--lock-d);color:var(--muted)}
.order-line{min-height:62px;border-bottom:2px solid var(--line);border-top:2px solid var(--line);padding:10px 0;display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px;align-content:flex-start}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile{padding:9px 14px;border:2px solid var(--line);border-radius:12px;background:var(--surface);box-shadow:0 3px 0 var(--line);font-size:16px;font-weight:600}
.tile.ghost{color:transparent;background:var(--surface-2);box-shadow:none;border-color:var(--surface-2)}
.vi{display:flex;gap:12px;align-items:flex-start;margin-bottom:16px}
.vi .say{border:2px solid var(--line);border-radius:14px;padding:10px 14px;font-size:17px;background:var(--surface);position:relative}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:flex;flex-direction:column;gap:10px}
.match .opt{justify-content:center;text-align:center;font-size:15px;min-height:54px}
.match .opt.gone{opacity:.35;box-shadow:none;border-color:var(--green)}
textarea.ans,textarea.essay{width:100%;border:2px solid var(--line);border-radius:14px;background:var(--surface);color:var(--fg);padding:14px;font:inherit;font-size:16px;line-height:1.6;resize:vertical}
textarea.ans{min-height:120px}
textarea.essay{min-height:280px}
textarea:focus{border-color:var(--blue);outline:none}

/* Completion */
.done-screen{text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;padding-top:20px}
.done-screen h1{font-size:34px;color:var(--gold-d)}
.done-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;width:100%;max-width:460px}
.ds{border:2px solid var(--c,var(--line));border-radius:16px;overflow:hidden;background:var(--surface)}
.ds b{display:block;background:var(--c);color:var(--on);font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:5px}
.ds span{display:block;font-family:var(--f-display);font-weight:800;font-size:24px;padding:8px 4px;color:var(--c)}

/* Mock exam */
.timer{font-family:var(--f-display);font-weight:800;font-size:20px;display:inline-flex;gap:6px;align-items:center;padding:6px 12px;border-radius:12px;background:var(--surface-2)}
.timer.low{background:var(--red-soft);color:var(--red-d)}
.mq{border:2px solid var(--line);border-radius:16px;background:var(--surface);padding:16px;display:flex;flex-direction:column;gap:12px}
.mq .num{font-family:var(--f-display);font-weight:800;color:var(--muted)}
.mq .opts{gap:8px}
.mq .opt{font-size:15px;padding:10px 12px}
.mlist{display:flex;flex-direction:column;gap:16px}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.steps span{font-size:12px;font-weight:800;letter-spacing:.06em;padding:5px 10px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.steps span.on{background:var(--blue);color:var(--on)}
.steps span.ok{background:var(--green-soft);color:var(--green-d)}
.wc{font-size:13px;font-weight:700}
.wc.ok{color:var(--green-d)} .wc.low{color:var(--gold-d)} .wc.high{color:var(--red-d)}
.docs{white-space:pre-line;font-size:14px;background:var(--surface-2);border-radius:12px;padding:12px 14px;margin:10px 0}
.plan{margin:8px 0 0;padding-left:20px;font-size:14px}

/* AI grading */
.grade{border:2px solid var(--line);border-radius:16px;background:var(--surface);padding:16px;display:flex;flex-direction:column;gap:12px}
.score-big{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.score-big b{font-family:var(--f-display);font-size:42px;line-height:1;color:var(--blue)}
.crit{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;font-size:14px}
.crit .bar{grid-column:1/-1;height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden;margin-bottom:6px}
.crit .bar i{display:block;height:100%;background:var(--blue)}
.corr{display:flex;flex-direction:column;gap:8px}
.corr div{border-left:4px solid var(--gold);background:var(--surface-2);padding:8px 12px;border-radius:0 10px 10px 0;font-size:14px}
.corr s{color:var(--red-d)} .corr ins{text-decoration:none;color:var(--green-d);font-weight:700}
.improved{white-space:pre-wrap;background:var(--green-soft);border-radius:12px;padding:12px 14px;font-size:15px}
.spinner{width:18px;height:18px;border-radius:50%;border:3px solid var(--surface-2);border-top-color:var(--blue);animation:spin .8s linear infinite;display:inline-block;vertical-align:-3px}
@keyframes spin{to{transform:rotate(360deg)}}

/* Sheet */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(10,12,30,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:22px 22px 0 0;max-height:88vh;overflow:auto;padding-top:22px;padding-bottom:max(22px,env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:22px}}
.sheet h2{font-size:24px;margin-bottom:6px}
.pick{display:grid;gap:10px;margin:14px 0}
.pick.cols3{grid-template-columns:repeat(3,minmax(0,1fr))}
.pick button{border:2px solid var(--line);border-radius:14px;padding:12px 14px;text-align:left;box-shadow:0 3px 0 var(--line);background:var(--surface)}
.pick button b{display:block;font-family:var(--f-display);font-size:18px}
.pick button span{font-size:12px;color:var(--muted)}
.pick button[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft);box-shadow:0 3px 0 var(--blue)}
.pick button:disabled{opacity:.4;cursor:not-allowed}

.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);opacity:0;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:80;pointer-events:none;transition:all .25s;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

.week{display:flex;align-items:flex-end;gap:8px;height:120px;margin-top:12px}
.week .d{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.week .b{width:100%;max-width:34px;border-radius:8px 8px 4px 4px;background:var(--blue-soft);min-height:4px}
.week .d.today .b{background:var(--blue)}
.week small{font-size:11px;color:var(--muted);font-weight:700}
.week em{font-style:normal;font-size:11px;font-weight:700;color:var(--muted)}
.hist{display:flex;flex-direction:column;gap:8px}
.hist div{display:flex;gap:10px;align-items:center;justify-content:space-between;border:2px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px;flex-wrap:wrap}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{padding:8px 12px;font-weight:700;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--blue);color:var(--on)}


/* Reminder banner */
.nudge{display:flex;align-items:center;gap:14px;background:var(--pink-soft);border:2px solid var(--pink);border-radius:var(--r);padding:12px 16px;margin-bottom:18px;flex-wrap:wrap}
.nudge .txt{flex:1 1 220px;min-width:0}
.nudge b{display:block;font-family:var(--f-display);font-size:19px;line-height:1.2}
.nudge span{font-size:14px;color:var(--muted)}
.nudge.ok{background:var(--blue-soft);border-color:var(--blue)}
/* Crash plan */
.plan-today{display:flex;flex-direction:column;gap:10px}
.ptask{display:flex;align-items:center;gap:14px;padding:14px 16px;border:2px solid var(--line);border-radius:16px;background:var(--surface);text-align:left;width:100%;box-shadow:0 3px 0 var(--line)}
.ptask:hover{background:var(--surface-2)}
.ptask .chk{width:32px;height:32px;border-radius:50%;border:3px solid var(--lock-d);display:grid;place-items:center;flex:none;color:var(--on)}
.ptask.done{border-color:var(--blue);background:var(--blue-soft)}
.ptask.done .chk{background:var(--blue);border-color:var(--blue)}
.ptask .t-body{flex:1;min-width:0}
.ptask .t-body b{display:block}
.ptask .t-body span{font-size:13px;color:var(--muted)}
.weeks{display:flex;flex-direction:column;gap:8px}
.wrow{display:grid;grid-template-columns:64px repeat(7,minmax(0,1fr));gap:6px;align-items:center}
.wrow small{font-size:12px;font-weight:700;color:var(--muted)}
.dot{aspect-ratio:1;max-width:34px;width:100%;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;font-size:11px;font-weight:800;color:var(--muted);justify-self:center}
.dot.full{background:var(--blue);color:var(--on)}
.dot.part{background:var(--pink);color:var(--on-pink)}
.dot.today{outline:3px solid var(--pink-d);outline-offset:2px}
.dot.mock{border:2px dashed var(--gold-d)}
/* Annotated essay */
.annot{white-space:pre-wrap;line-height:2;font-size:16px;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:14px 16px}
.annot mark{background:var(--red-soft);color:inherit;border-bottom:3px solid var(--red);border-radius:4px;padding:0 2px;cursor:pointer}
.annot mark sup{font-family:var(--f-display);font-weight:800;color:var(--red-d);font-size:11px;margin-left:2px}
.annot mark.k-orthographe{background:var(--gold-soft);border-color:var(--gold)}
.annot mark.k-vocabulaire,.annot mark.k-registre{background:var(--pink-soft);border-color:var(--pink-d)}
.corr .n{font-family:var(--f-display);font-weight:800;color:var(--red-d);margin-right:6px}
.corr div.flash{outline:3px solid var(--pink-d)}
.ktag{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--surface);margin-left:6px;color:var(--muted)}

@media (max-width:1150px){.app{grid-template-columns:96px minmax(0,1fr)}.rail{display:none}.side .nav-btn span,.brand .bt{display:none}.nav-btn{justify-content:center}.brand{justify-content:center}.mobile-only{display:inline-flex}}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr);gap:0}
  .side{display:none}
  .main{padding-block:10px 110px}
  .bottom{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:2px solid var(--line);justify-content:space-around;
    padding-top:6px;padding-bottom:max(8px,env(safe-area-inset-bottom,0px));padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
  .bottom .nav-btn{flex-direction:column;gap:2px;padding:6px 10px;font-size:10px;letter-spacing:.04em}
  .bottom .nav-btn span{display:block}
  .grid2{grid-template-columns:minmax(0,1fr)}
  .q-title{font-size:21px}
  .sentence{font-size:19px}
  .stats{gap:10px}
  .stat{font-size:16px}
  .level-hero h1{font-size:23px}
  .done-stats{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media (max-width:760px){.bottom .nav-btn{flex:1 1 0;min-width:0;padding:6px 1px;font-size:10.5px;letter-spacing:0;text-transform:none;white-space:nowrap}.bottom .nav-btn span{overflow:visible}}

@media (max-width:760px){.games{grid-template-columns:1fr 1fr;gap:10px}.game{padding:12px}.game .g-d{display:none}.game .g-t b{font-size:15px}.game .g-ic{width:36px;height:36px}}
@media (max-width:760px){.game:first-child{grid-column:1/-1}}
</style>

</div>

XD("CE","B2","Article d'opinion","La semaine de quatre jours, fausse bonne idée ?",`Présentée comme la solution miracle à l'épuisement professionnel, la semaine de quatre jours séduit. Les expériences menées au Royaume-Uni et en Islande font état de salariés moins stressés et d'une productivité globalement maintenue. Faut-il pour autant généraliser le modèle ? Rien n'est moins sûr.

XD("CE","C1","Article","Les langues autochtones au Canada",`Sur les quelque soixante-dix langues autochtones parlées au Canada, la majorité est aujourd'hui considérée comme menacée. Pendant plus d'un siècle, le système des pensionnats a interdit aux enfants de parler leur langue, rompant la transmission entre générations. Les conséquences se font encore sentir : dans de nombreuses communautés, seuls les aînés maîtrisent encore la langue de leurs ancêtres.

XD("CE","C1","Éditorial","Gratuité des transports",`La gratuité des transports en commun, adoptée par plusieurs villes européennes, revient régulièrement dans le débat québécois. Ses partisans y voient une mesure à la fois sociale et écologique : elle soulagerait le budget des ménages modestes tout en incitant les automobilistes à laisser leur voiture au garage.

XD("CE","C2","Essai littéraire","La traduction",`On répète volontiers, à la suite de l'adage italien, que traduire c'est trahir. La formule, pour séduisante qu'elle soit, repose sur un postulat discutable : celui d'un texte original détenteur d'un sens unique et stable, que la traduction ne pourrait qu'altérer. Or, tout lecteur sait qu'un texte n'existe que dans les lectures qu'il suscite, et que l'œuvre la plus « fidèle » à elle-même change de visage d'une génération à l'autre.

XD("CO","B2","Débat radio","Faut-il taxer la malbouffe ?",`F: Pour réduire l'obésité, plusieurs pays ont instauré une taxe sur les boissons sucrées. Docteur Ouellet, vous êtes favorable à une telle mesure au Québec ?

XD("CO","B2","Conférence","Le sommeil des adolescents",`F: Contrairement à une idée reçue, si les adolescents se couchent tard, ce n'est pas uniquement par paresse ou à cause des écrans. À la puberté, l'horloge biologique se décale : la mélatonine, l'hormone du sommeil, est sécrétée environ deux heures plus tard que chez l'enfant. Un adolescent qui s'endort à vingt-trois heures et se lève à six heures trente pour prendre l'autobus scolaire accumule donc une dette de sommeil considérable.

XD("CO","B2","Entretien","Une entrepreneure sociale",`H: Vous avez fondé une entreprise qui embauche exclusivement des personnes éloignées de l'emploi. Comment est née l'idée ?

XD("CO","B2","Chronique","Le français au travail",`H: Au Québec, la loi garantit le droit de travailler en français. Pourtant, selon plusieurs enquêtes, une part importante des employés montréalais utilise principalement l'anglais au travail, surtout dans les secteurs des technologies et de la finance. Les employeurs invoquent une clientèle internationale ; les syndicats dénoncent une exigence d'anglais parfois injustifiée à l'embauche.

XD("CO","C1","Conférence","Le paradoxe du choix",`F: On pourrait croire que plus nous avons de choix, plus nous sommes satisfaits. L'expérience montre souvent l'inverse. Dans une étude devenue célèbre, des chercheurs ont installé dans un supermarché un stand de dégustation de confitures : un jour avec six variétés, un autre avec vingt-quatre. Le grand assortiment attirait davantage de curieux, mais les clients achetaient dix fois plus souvent quand le choix était restreint.
Pourquoi ? Parce que chaque option supplémentaire augmente le coût de la décision et, surtout, le risque de regret. Face à vingt-quatre confitures, on se demande toujours si l'on n'aurait pas préféré une autre.
Il convient toutefois de nuancer : des travaux plus récents n'ont pas toujours reproduit cet effet. Il semble dépendre de la complexité des options et de la connaissance préalable du consommateur. Un expert en vins ne sera pas paralysé par une carte de deux cents bouteilles ; un novice, si.`,[

XD("CO","C1","Table ronde","L'école et le numérique",`H: Madame Fortin, vous êtes directrice d'école. Les tablettes en classe, bonne ou mauvaise idée ?
F: Ni l'un ni l'autre, à vrai dire. Un outil n'a pas de valeur pédagogique en soi. J'ai vu des tablettes transformer une classe, permettant à un élève dyslexique de suivre un texte lu à voix haute ; et j'en ai vu servir de simples cahiers à quatre cents dollars.

function genPC(key,verbs,n,frame="Hier"){

function genArticle(key,kind,n){
 const rnd=rngFrom(key),out=[];
 for(let k=0;k<n;k++){
  const [w,g,pl]=NN[Math.floor(rnd()*NN.length)],v=VOW.test(w),plural=rnd()<.3;
  let c,pool,ex;
  if(kind==="def"){c=plural?"les":v?"l'":g==="m"?"le":"la";pool=["le","la","l'","les"];ex=plural?"Số nhiều → les.":v?"Trước nguyên âm hoặc h câm → l'.":`${w} là giống ${g==="m"?"đực → le":"cái → la"}.`;}
  else if(kind==="indef"){c=plural?"des":g==="m"?"un":"une";pool=["un","une","des"];ex=plural?"Số nhiều → des.":`${w} là giống ${g==="m"?"đực → un":"cái → une"}.`;}
  else if(kind==="dem"){c=plural?"ces":g==="f"?"cette":v?"cet":"ce";pool=["ce","cet","cette","ces"];ex=plural?"Số nhiều → ces.":g==="f"?"Giống cái → cette.":v?"Giống đực trước nguyên âm hoặc h câm → cet.":"Giống đực → ce.";}
  else if(kind==="poss"){c=plural?"mes":(g==="m"||v)?"mon":"ma";pool=["mon","ma","mes"];ex=plural?"Số nhiều → mes.":g==="f"&&v?"Giống cái nhưng bắt đầu bằng nguyên âm → mon (mon amie, mon école).":g==="m"?"Giống đực → mon.":"Giống cái → ma.";}

function genPlural(key,n){

function genAdj(key,n){

  M("Phủ định của « Je parle allemand »:",["Je ne parle pas allemand.","Je parle pas ne allemand.","Je ne pas parle allemand.","Je pas parle allemand."]),
  M("Phủ định của « Il aime le café »:",["Il n'aime pas le café.","Il ne aime pas le café.","Il n'aime pas de café.","Il aime ne pas le café."]),
  M("Phủ định của « J'ai une voiture »:",["Je n'ai pas de voiture.","Je n'ai pas une voiture.","Je ne ai pas de voiture.","Je n'ai pas la voiture."],"un/une/des → de sau phủ định."),
  M("Phủ định của « Elle mange de la viande »:",["Elle ne mange pas de viande.","Elle ne mange pas de la viande.","Elle mange pas viande.","Elle ne mange de viande pas."]),
  M("Phủ định của « C'est un chat »:",["Ce n'est pas un chat.","Ce n'est pas de chat.","C'est ne pas un chat.","Ce n'est un chat pas."],"Sau être, mạo từ giữ nguyên."),
  M("Phủ định của « Je me lève tôt »:",["Je ne me lève pas tôt.","Je me ne lève pas tôt.","Je ne lève me pas tôt.","Ne je me lève pas tôt."]),
  F("Je n'aime pas ___ sport.",["le","de","du","un"],"Sau aimer, mạo từ xác định giữ nguyên."),
  F("Il n'y a pas ___ lait dans le frigo.",["de","du","le","un"]),
  O("Tôi không hiểu.","Je|ne|comprends|pas",["rien","comprend"]),
  T("Tôi không có xe hơi.",["Je n'ai pas de voiture"])]),
 SEC("Ne (n')… personne","<b>ne… personne</b> = không ai. Trái nghĩa với <b>quelqu'un</b>.<br>Làm chủ ngữ: <b>Personne ne</b> vient.",[
  M("« Il n'y a personne » nghĩa là?",["Không có ai","Có một người","Có nhiều người","Không có gì"]),
  F("Je ne connais ___ ici.",["personne","rien","jamais","pas"]),
  M("Trả lời phủ định: « Tu vois quelqu'un ? »",["Non, je ne vois personne.","Non, je ne vois rien.","Non, je vois personne pas.","Non, je ne vois pas quelqu'un."]),
  F("___ ne m'appelle.",["Personne","Rien","Pas","Jamais"]),
  F("Il ne parle à ___.",["personne","rien","pas","aucun"]),
  T("Tôi không gặp ai cả.",["Je ne vois personne","Je n'ai vu personne","Je ne rencontre personne","Je n'ai rencontré personne"])]),
 SEC("Ne (n')… rien","<b>ne… rien</b> = không gì cả. Trái nghĩa với <b>quelque chose</b>.<br>Làm chủ ngữ: <b>Rien ne</b> marche.",[
  F("Je ne mange ___ le matin.",["rien","personne","pas","aucun"]),
  M("Trả lời phủ định: « Tu veux quelque chose ? »",["Non, je ne veux rien.","Non, je ne veux personne.","Non, je veux rien pas.","Non, je ne veux pas quelque chose."]),
  F("___ ne marche dans cette maison !",["Rien","Personne","Jamais","Pas"]),
  F("Il n'y a ___ dans le frigo.",["rien","personne","pas","aucune"]),
  L("Je n'entends rien.","Câu này nghĩa là gì?",["Tôi không nghe thấy gì.","Tôi không nghe thấy ai.","Tôi nghe thấy mọi thứ.","Tôi không bao giờ nghe."]),
  PR([["ne… pas","không"],["ne… rien","không gì cả"],["ne… personne","không ai cả"],["quelque chose","cái gì đó"],["quelqu'un","ai đó"]])])
]),
UNIT("L'expression du temps","Nói giờ, ngày, tần suất",[
 SEC("Các thời điểm","<b>en</b> + tháng, năm, mùa (trừ <b>au</b> printemps): en mai, en 2025, en hiver.<br><b>à</b> + giờ: à 9 heures · <b>le</b> + ngày: le 15 juillet · <b>le lundi</b> = mỗi thứ Hai.",[
  F("Je suis né ___ mai.",["en","au","à","le"]),
  F("___ hiver, il fait froid.",["En","Au","À","Le"]),
  F("___ printemps, les fleurs poussent.",["Au","En","À","Le"]),
  F("Le cours commence ___ 9 heures.",["à","en","au","le"]),
  F("Je travaille ___ lundi au vendredi.",["du","de","le","en"]),
  F("Nous partons ___ 15 juillet.",["le","en","au","à"]),
  M("« le lundi » nghĩa là?",["Mỗi thứ Hai","Thứ Hai tới","Thứ Hai tuần trước","Chỉ một thứ Hai"]),
  M("Il est 14 h 45. Cách nói khác:",["Il est trois heures moins le quart.","Il est deux heures et quart.","Il est trois heures et quart.","Il est deux heures moins le quart."]),
  L("Il est huit heures et demie.","Mấy giờ?",["8:30","8:15","7:30","8:45"]),
  PR([["le matin","buổi sáng"],["l'après-midi","buổi chiều"],["le soir","buổi tối"],["la nuit","ban đêm"],["midi","giữa trưa"]])]),
 SEC("Giới từ chỉ thời gian","<b>depuis</b>: từ… đến giờ (vẫn tiếp diễn) · <b>il y a</b>: cách đây · <b>dans</b>: … nữa (tương lai) · <b>pendant</b>: trong suốt.",[
  F("J'habite ici ___ trois ans.",["depuis","il y a","dans","pendant"],"Hành động vẫn tiếp diễn → depuis."),
  F("Je suis arrivé ___ deux semaines.",["il y a","depuis","dans","pendant"],"il y a = cách đây."),
  F("Le film commence ___ dix minutes.",["dans","il y a","depuis","pendant"],"dans = sau (tương lai)."),
  F("J'ai dormi ___ huit heures.",["pendant","depuis","dans","il y a"]),
  F("Je t'attends ___ une heure !",["depuis","il y a","dans","en"]),
  F("Il part en vacances ___ trois jours.",["dans","il y a","depuis","pendant"]),
  M("« il y a deux ans » nghĩa là?",["cách đây hai năm","trong hai năm","hai năm nữa","từ hai năm nay"]),
  T("Tôi học tiếng Pháp được một năm rồi.",["J'apprends le français depuis un an","J'étudie le français depuis un an"])]),
 SEC("Trạng từ tần suất","<b>toujours</b> > <b>souvent</b> > <b>parfois</b> > <b>rarement</b> > <b>ne… jamais</b>.<br>Trạng từ đứng sau động từ: Je marche souvent.",[
  F("Je bois ___ du café le matin : chaque jour !",["toujours","jamais","rarement","parfois"]),
  F("Il ne fume ___.",["jamais","toujours","souvent","parfois"]),
  M("Xếp từ thường xuyên nhất đến ít nhất:",["toujours > souvent > parfois > rarement > jamais","souvent > toujours > rarement > parfois > jamais","jamais > rarement > parfois > souvent > toujours","toujours > parfois > souvent > jamais > rarement"]),
  F("Nous allons ___ au cinéma : une fois par an.",["rarement","souvent","toujours","tous les jours"]),
  M("« de temps en temps » gần nghĩa với…",["parfois","toujours","jamais","rarement"]),
  O("Tôi thường đi bộ.","Je|marche|souvent",["jamais","souvant"]),
  L("Elle va parfois à la piscine.","Câu này nghĩa là gì?",["Thỉnh thoảng cô ấy đi bơi.","Cô ấy luôn đi bơi.","Cô ấy không bao giờ đi bơi.","Cô ấy đi bơi mỗi ngày."])])
]),
UNIT("L'expression du lieu","Chỉ đường, nói nơi ở",[
 SEC("Mạo từ với tên nước, thành phố","Tên nước có mạo từ: <b>le</b> Canada, <b>la</b> France, <b>l'</b>Italie, <b>les</b> États-Unis.<br>Tên thành phố <b>không</b> có mạo từ: Paris, Toronto.",[
  F("___ Canada est un grand pays.",["Le","La","L'","Les"]),
  F("___ France est en Europe.",["La","Le","L'","Les"]),
  F("___ États-Unis sont voisins du Canada.",["Les","Le","La","L'"]),
  F("___ Italie est célèbre pour sa cuisine.",["L'","La","Le","Les"]),
  F("___ Mexique est en Amérique du Nord.",["Le","La","Les","L'"]),
  M("Câu nào đúng?",["J'aime Paris.","J'aime le Paris.","J'aime la Paris.","J'aime les Paris."],"Tên thành phố không có mạo từ.")]),
 SEC("Giới từ trước địa danh","<b>à</b> + thành phố · <b>en</b> + nước giống cái (hoặc bắt đầu bằng nguyên âm) · <b>au</b> + nước giống đực · <b>aux</b> + nước số nhiều.",[
  ...genPlace("a1-6b",10)]),
 SEC("Giới từ à và de","<b>à</b> + le = <b>au</b>, à + les = <b>aux</b> (à la, à l' giữ nguyên).<br><b>de</b> + le = <b>du</b>, de + les = <b>des</b> (de la, de l' giữ nguyên).",[
  ...genContract("a1-6c",10)]),
 SEC("à và chez","<b>à</b> + nơi chốn: à la banque, au marché.<br><b>chez</b> + người: chez Paul, chez le médecin, chez moi.",[
  F("Je vais ___ médecin.",["chez le","au","à le","chez"]),
  F("Je vais ___ boulangerie.",["à la","chez la","chez","au"]),
  F("Ce soir, on dîne ___ Paul.",["chez","à","au","de"]),
  F("J'ai rendez-vous ___ dentiste.",["chez le","au","à la","de"]),
  F("Elle est ___ pharmacie.",["à la","chez la","au","chez"]),
  M("« chez moi » nghĩa là?",["ở nhà tôi","ở chỗ làm của tôi","với tôi","cho tôi"]),
  F("Nous allons ___ coiffeur.",["chez le","au","à la","chez la"])]),
 SEC("Từ chỉ vị trí","<b>sur</b> (trên), <b>sous</b> (dưới), <b>devant</b> (trước), <b>derrière</b> (sau), <b>entre</b> (giữa), <b>dans</b> (trong), <b>à côté de</b> (cạnh), <b>en face de</b> (đối diện), <b>près de / loin de</b> (gần / xa).",[
  F("Le chat dort ___ le lit. (bên dưới)",["sous","sur","dans","devant"]),
  F("Le livre est ___ la table. (bên trên)",["sur","sous","entre","derrière"]),
  F("La banque est ___ la poste. (bên cạnh)",["à côté de","en face","entre","sur"]),
  F("La pharmacie est ___ la boulangerie et le café.",["entre","à côté","devant","sous"]),
  F("J'habite ___ l'université : à cinq minutes.",["près de","loin de","sous","entre"]),
  F("La voiture est ___ la maison. (phía trước)",["devant","derrière","sous","dans"]),
  F("Le cinéma est en face ___ musée.",["du","de","de la","des"]),
  PR([["sur","trên"],["sous","dưới"],["devant","trước"],["derrière","sau"],["entre","giữa"]]),
  L("La gare est à côté de l'hôtel.","Câu này nghĩa là gì?",["Nhà ga ở cạnh khách sạn.","Nhà ga đối diện khách sạn.","Nhà ga sau khách sạn.","Nhà ga xa khách sạn."])]),
 SEC("Động từ chỉ di chuyển","<b>aller à / au / en</b> (đi đến) · <b>venir de / du / des</b> (đến từ) · <b>partir pour</b> (lên đường đi) · <b>rentrer de</b> (trở về từ).",[
  F("Je viens ___ Vietnam.",["du","de","au","en"]),
  F("Elle vient ___ France.",["de","du","en","à"]),
  F("Ils viennent ___ États-Unis.",["des","de","du","aux"]),
  F("Tu rentres ___ travail à quelle heure ?",["du","de","au","à"]),
  F("Je vais ___ Japon cet été.",["au","en","à","du"]),
  F("Il arrive ___ Montréal ce soir.",["à","en","au","chez"]),
  M("« Je viens de Hanoï » nghĩa là?",["Tôi đến từ Hà Nội","Tôi đi Hà Nội","Tôi sống ở Hà Nội","Tôi vừa ăn ở Hà Nội"])])
]),
UNIT("Le nom et l'article","Gọi tên đồ vật, người",[
 SEC("Giống đực và giống cái của danh từ","Thường thêm <b>-e</b>: étudiant → étudiante.<br>-eur → <b>-euse</b> (vendeuse), -teur → <b>-trice</b> (actrice), -ien → <b>-ienne</b>, -er → <b>-ère</b>.",[
  M("Giống cái của « acteur »:",["actrice","acteure","acteuse","acteresse"]),
  M("Giống cái của « boulanger »:",["boulangère","boulangeuse","boulangerie","boulangeure"]),
  M("Giống cái của « chanteur »:",["chanteuse","chantrice","chanteure","chantère"]),
  M("Giống cái của « musicien »:",["musicienne","musiciene","musiciennes","musicièn"]),
  M("Giống cái của « infirmier »:",["infirmière","infirmiere","infirmieuse","infirmice"]),
  M("Giống cái của « directeur »:",["directrice","directeuse","directeure","directière"]),
  M("Giống cái của « journaliste »:",["journaliste","journalistesse","journalistrice","journalistienne"],"Danh từ tận cùng -e thường giữ nguyên."),
  M("Giống cái của « vendeur »:",["vendeuse","vendrice","vendeure","vendière"]),
  M("Giống cái của « étudiant »:",["étudiante","étudiantes","étudiante e","étudiane"])]),
 SEC("Số ít và số nhiều của danh từ","Thông thường thêm <b>-s</b>. -eau, -eu → <b>-x</b> (gâteaux, jeux). -al → <b>-aux</b> (journaux). -s, -x, -z giữ nguyên.",[
  ...genPlural("a1-7b",10)]),
 SEC("Mạo từ không xác định và xác định","<b>un, une, des</b>: lần đầu nhắc đến, chưa xác định.<br><b>le, la, l', les</b>: đã xác định hoặc nói chung (J'aime le café).",[
  ...genArticle("a1-7c1","indef",7),...genArticle("a1-7c2","def",7),
  F("J'ai un chien. ___ chien s'appelle Rex.",["Le","Un","La","Des"],"Lần thứ hai nhắc đến → mạo từ xác định.")]),
 SEC("Mạo từ rút gọn sau à và de","au, aux, du, des thay cho à le, à les, de le, de les.",[
  ...genContract("a1-7d",8),
  F("Je parle ___ professeur.",["au","à le","du","à la"]),
  F("C'est le livre ___ étudiants.",["des","de les","du","aux"])])
]),
UNIT("Les adjectifs démonstratifs et possessifs","Chỉ định, nói về sở hữu",[
 SEC("Tính từ chỉ định","<b>ce</b> (đực), <b>cet</b> (đực trước nguyên âm/h câm), <b>cette</b> (cái), <b>ces</b> (số nhiều).",[
  ...genArticle("a1-8a","dem",12)]),
 SEC("Tính từ sở hữu","mon/ma/mes · ton/ta/tes · son/sa/ses · notre/nos · votre/vos · leur/leurs.<br>Theo giống của <b>vật được sở hữu</b>. ma, ta, sa → <b>mon, ton, son</b> trước nguyên âm: mon amie.",[

  F("Marie aime ___ père.",["son","sa","ses","leur"],"son/sa theo giống của danh từ « père », không theo Marie."),

  T("Đây là căn hộ của tôi.",["C'est mon appartement","Voici mon appartement"])])
]),
UNIT("L'adjectif qualificatif","Miêu tả người và vật",[
 SEC("Giống của tính từ","Thêm <b>-e</b>: grand → grande. -eux → <b>-euse</b>, -if → <b>-ive</b>, -ien → <b>-ienne</b>, -er → <b>-ère</b>.<br>Bất quy tắc: beau → belle, nouveau → nouvelle, vieux → vieille, blanc → blanche.",[
  ...genAdj("a1-9a",10)]),
 SEC("Số nhiều của tính từ","Thêm <b>-s</b>: grands, grandes. -eux, -s giữ nguyên (heureux). -al → <b>-aux</b> (nationaux). -eau → <b>-eaux</b> (beaux).",[
  ...genAdj("a1-9b",8),
  M("Số nhiều giống đực của « national »:",["nationaux","nationals","nationales","nationaus"])]),
 SEC("Vị trí của tính từ","Đa số đứng <b>sau</b> danh từ: une voiture rouge.<br>Một số tính từ ngắn đứng <b>trước</b>: beau, joli, grand, petit, bon, nouveau, vieux, jeune.<br>Trước nguyên âm: un <b>bel</b> hôtel, un <b>nouvel</b> ami, un <b>vieil</b> homme.",[
  M("Cụm nào đúng?",["une belle maison","une maison belle","une bel maison","un belle maison"]),
  M("Cụm nào đúng?",["un livre intéressant","un intéressant livre","une livre intéressant","un livre intéressante"]),
  F("C'est un ___ homme. (vieux)",["vieil","vieux","vieille","vieilles"],"vieux → vieil trước nguyên âm/h câm."),
  F("C'est un ___ hôtel. (beau)",["bel","beau","belle","beaux"]),
  F("Voici mon ___ appartement. (nouveau)",["nouvel","nouveau","nouvelle","nouveaux"]),
  M("Tính từ nào thường đứng TRƯỚC danh từ?",["petit","français","rouge","intéressant"]),
  O("một cô gái trẻ người Pháp","une|jeune|fille|française",["français","jeun"]),
  M("Cụm nào đúng?",["des étudiants canadiens","des canadiens étudiants","des étudiants canadien","des étudiant canadiens"]),
  T("một ngôi nhà lớn",["une grande maison"])])
]),
UNIT("La comparaison","So sánh",[
 SEC("So sánh tính từ và trạng từ","<b>plus / moins / aussi</b> + tính từ/trạng từ + <b>que</b>.<br>Bất quy tắc: bon → <b>meilleur</b>, bien → <b>mieux</b>.",[
  F("Paul est ___ grand que Marc. (+)",["plus","moins","aussi","autant"]),
  F("Le train est ___ rapide que l'avion. (−)",["moins","plus","aussi","autant"]),
  F("Elle est ___ intelligente que son frère. (=)",["aussi","autant","plus","si"]),
  F("Ce gâteau est ___ que l'autre. (bon, +)",["meilleur","plus bon","mieux","plus meilleur"]),
  F("Il chante ___ que moi. (bien, +)",["mieux","meilleur","plus bien","plus bon"]),
  F("Toronto est plus grand ___ Ottawa.",["qu'","que","de","comme"],"que → qu' trước nguyên âm."),
  O("Mùa đông ở đây lạnh hơn ở Việt Nam.","L'hiver|est|plus|froid|ici|qu'au|Vietnam",["moins","que"])]),
 SEC("So sánh danh từ","<b>plus de / moins de / autant de</b> + danh từ + <b>que</b>.",[
  F("J'ai ___ livres que toi. (+)",["plus de","plus","plus des","autant"]),
  F("Il a ___ travail que moi. (=)",["autant de","aussi","autant","aussi de"]),
  F("Il y a ___ voitures qu'avant. (−)",["moins de","moins","moins des","pas de"]),
  F("Elle a autant ___ amis que sa sœur.",["d'","de","des","que"]),
  M("« J'ai moins d'argent que toi » nghĩa là?",["Tôi có ít tiền hơn bạn","Tôi có nhiều tiền hơn bạn","Tôi có bằng tiền bạn","Tôi không có tiền"])]),
 SEC("So sánh động từ","Động từ + <b>plus / moins / autant</b> + que.",[
  F("Je travaille ___ que toi. (=)",["autant","aussi","autant de","si"]),
  F("Il mange ___ que sa sœur. (+)",["plus","plus de","mieux","meilleur"]),
  F("Tu dors ___ que moi. (−)",["moins","moins de","pire","moindre"]),
  M("« Elle parle autant que lui » nghĩa là?",["Cô ấy nói nhiều bằng anh ấy","Cô ấy nói nhiều hơn anh ấy","Cô ấy nói ít hơn anh ấy","Cô ấy nói hay hơn anh ấy"])])
]),
UNIT("L'article partitif et les quantités","Mua sắm, gọi món",[
 SEC("du, de la, de l', des","Dùng với thứ không đếm được hoặc một phần: <b>du</b> pain, <b>de la</b> salade, <b>de l'</b>eau, <b>des</b> fruits.",[
  F("Je bois ___ lait.",["du","de la","de l'","des"]),
  F("Tu veux ___ salade ?",["de la","du","de l'","des"]),
  F("Il mange ___ fruits.",["des","du","de la","de l'"]),
  F("Nous achetons ___ huile d'olive.",["de l'","du","de la","des"]),
  F("Elle prend ___ sucre dans son café.",["du","de la","de l'","des"]),
  F("Je voudrais ___ eau, s'il vous plaît.",["de l'","de la","du","des"]),
  F("Au petit-déjeuner, je mange ___ pain et ___ confiture.".replace(" et ___ confiture"," avec de la confiture"),["du","de la","des","de l'"]),

UNIT("L'interrogation","Hỏi thông tin, lựa chọn",[

 SEC("Câu hỏi đảo ngữ","Động từ – chủ ngữ: <b>Parlez-vous</b>… ? Với danh từ: Marie <b>parle-t-elle</b>… ?<br>Ở passé composé: <b>As-tu</b> vu… ?",[

  M("Đảo ngữ: « Vous êtes allés au musée ? »",["Êtes-vous allés au musée ?","Vous êtes-vous allés au musée ?","Allés-vous êtes au musée ?","Êtes allés-vous au musée ?"]),

]),
UNIT("La négation","Phủ định đa dạng",[
 SEC("Ne… pas","Ở thì kép, <b>ne… pas</b> bao quanh trợ động từ: Je <b>n'ai pas</b> vu. Với nguyên mẫu: <b>ne pas</b> + nguyên mẫu (Je préfère ne pas sortir).",[
  M("Phủ định của « J'ai compris »:",["Je n'ai pas compris.","Je n'ai compris pas.","Je ne pas ai compris.","Je ai pas compris."]),
  M("Câu nào đúng?",["Il m'a dit de ne pas fumer.","Il m'a dit de ne fumer pas.","Il m'a dit de pas ne fumer.","Il m'a dit ne de pas fumer."]),
  M("Phủ định của « Je me suis réveillé »:",["Je ne me suis pas réveillé.","Je me ne suis pas réveillé.","Je ne suis pas me réveillé.","Je ne me suis réveillé pas."]),
  F("Nous ___ sommes pas allés au concert.",["ne","n'","pas","non"]),
  F("J'espère ___ être en retard.",["ne pas","pas","ne","n'"])]),
 SEC("Ne… rien, ne… personne, ne… aucun","<b>rien</b> (không gì), <b>personne</b> (không ai), <b>aucun(e)</b> + danh từ (không một… nào).<br>Ở thì kép: Je n'ai <b>rien</b> vu · Je n'ai vu <b>personne</b> (personne đứng sau phân từ).",[
  F("Je n'ai ___ vu.",["rien","personne","aucun","jamais"]),
  F("Je n'ai vu ___.",["personne","rien","aucune","pas"]),
  F("Il n'a ___ idée.",["aucune","aucun","rien","personne"],"idée giống cái → aucune."),
  F("Je n'ai ___ problème.",["aucun","aucune","rien","personne"]),
  M("Câu nào đúng?",["Je n'ai rencontré personne.","Je n'ai personne rencontré.","Je ne personne ai rencontré.","Je n'ai pas rencontré personne."]),
  F("___ n'est venu à la réunion.",["Personne","Rien","Aucune","Jamais"])]),
 SEC("Ne… jamais, ne… plus, ne… pas encore","<b>jamais</b> (không bao giờ) ↔ toujours/déjà · <b>plus</b> (không còn nữa) ↔ encore · <b>pas encore</b> (chưa) ↔ déjà.",[
  M("Phủ định của « Il fume encore »:",["Il ne fume plus.","Il ne fume pas encore.","Il ne fume jamais.","Il ne fume rien."]),
  M("Phủ định của « Tu as déjà mangé ? »",["Non, je n'ai pas encore mangé.","Non, je n'ai plus mangé.","Non, je n'ai jamais pas mangé.","Non, je n'ai encore mangé."]),
  F("Je ne suis ___ allé en Afrique.",["jamais","plus","rien","aucun"]),
  F("Elle n'habite ___ ici, elle a déménagé.",["plus","jamais","pas encore","rien"]),
  F("Le film n'a ___ commencé.",["pas encore","plus","jamais","rien"]),
  T("Tôi không bao giờ uống cà phê.",["Je ne bois jamais de café"])]),
 SEC("Ne… que và sans","<b>ne… que</b> = chỉ (không phải phủ định): Je <b>n'ai que</b> 10 dollars.<br><b>sans</b> + danh từ (không mạo từ) hoặc nguyên mẫu: un café <b>sans</b> sucre, partir <b>sans</b> dire au revoir.",[
  M("« Il ne mange que des légumes » nghĩa là?",["Anh ấy chỉ ăn rau","Anh ấy không ăn rau","Anh ấy ăn nhiều rau","Anh ấy không ăn gì"]),
  F("Je n'ai ___ deux euros.",["que","pas","plus","rien"]),
  F("Un thé ___ sucre, s'il vous plaît.",["sans","sans le","sans de","pas"]),
  F("Il est parti sans ___ au revoir.",["dire","dit","disant","dis"]),
  T("Tôi chỉ có một người anh.",["Je n'ai qu'un frère"])])
]),

 SEC("Mạo từ bộ phận và lược bỏ mạo từ","du, de la, de l', des với thứ không đếm được.<br>Sau từ chỉ lượng (<b>beaucoup de, peu de, assez de, trop de</b>) dùng <b>de</b> không mạo từ. Nghề nghiệp sau être không mạo từ.",[

 SEC("Mạo từ trong câu phủ định","un, une, des, du, de la → <b>de (d')</b>. le, la, les giữ nguyên. Sau être giữ nguyên.",[
  M("Phủ định của « Il a des amis à Paris »:",["Il n'a pas d'amis à Paris.","Il n'a pas des amis à Paris.","Il n'a pas les amis à Paris.","Il n'a pas amis à Paris."]),

  M("Phủ định của « J'aime les chiens »:",["Je n'aime pas les chiens.","Je n'aime pas de chiens.","Je n'aime pas des chiens.","Je n'aime pas chiens."]),
  M("Phủ định của « Ce sont des touristes »:",["Ce ne sont pas des touristes.","Ce ne sont pas de touristes.","Ce ne sont pas touristes.","Ce sont ne pas des touristes."]),
  F("Il n'y a plus ___ lait.",["de","du","le","un"])])
]),

  ...genAdj("a2-8a",12)]),

 SEC("Trạng từ đuôi -ment","Tính từ giống cái + <b>-ment</b>: lent → lente → <b>lentement</b>.<br>-ant → <b>-amment</b> (courant → couramment), -ent → <b>-emment</b> (prudent → prudemment). vrai → vraiment, bon → <b>bien</b>, mauvais → <b>mal</b>.",[

  M("Trạng từ của « heureux »:",["heureusement","heureuxment","heureusment","heureuxement"]),
  M("Trạng từ của « vrai »:",["vraiment","vraiement","vraiemment","vrament"]),
  F("Elle parle ___ français. (courant)",["couramment","courant","courante","courantement"]),

UNIT("L'impératif","Ra lệnh, khuyên, hướng dẫn",[
 SEC("Thể khẳng định và phủ định","Chỉ có 3 ngôi: (tu), (nous), (vous), bỏ chủ ngữ. Động từ -er bỏ <b>-s</b> ở ngôi tu: Parle ! Va !<br>Bất quy tắc: être → sois, soyons, soyez · avoir → aie, ayons, ayez · savoir → sache…<br>Phủ định: <b>Ne</b> parle <b>pas</b> !",[
  F("___ moins vite, s'il te plaît ! (parler, tu)",["Parle","Parles","Parlez","Parler"]),
  F("___ à l'heure demain ! (être, vous)",["Soyez","Êtes","Soyiez","Sois"]),
  F("___ patience ! (avoir, tu)",["Aie","As","Ai","Aies"]),
  F("___ au cinéma ce soir ! (aller, nous)",["Allons","Allez","Va","Allions"]),
  F("Ne ___ pas trop de sucre ! (manger, tu)",["mange","manges","mangez","manger"]),
  F("___ tes devoirs ! (finir, tu)",["Finis","Finit","Finissez","Fini"]),
  T("Đừng nói chuyện! (vous)",["Ne parlez pas"])]),
 SEC("Mệnh lệnh với động từ phản thân","Khẳng định: đại từ đứng <b>sau</b>, có gạch nối, te → <b>toi</b>: Lève-<b>toi</b> ! Levons-nous ! Levez-vous !<br>Phủ định: Ne <b>te</b> lève pas !",[
  F("___ ! Il est déjà 8 heures ! (se lever, tu)",["Lève-toi","Lève-te","Te lève","Lèves-toi"]),
  F("Ne ___ pas trop tard ! (se coucher, tu)",["te couche","couche-toi","toi couche","couches-te"]),
  F("___, il fait beau ! (se promener, nous)",["Promenons-nous","Nous promenons","Promenez-vous","Promènes-toi"]),
  F("Asseyez-___, s'il vous plaît.",["vous","nous","toi","se"]),
  M("Phủ định của « Dépêche-toi ! »",["Ne te dépêche pas !","Ne dépêche-toi pas !","Dépêche-toi pas !","Ne toi dépêche pas !"])]),
 SEC("Mệnh lệnh với đại từ bổ ngữ","Khẳng định: đại từ sau động từ, me → <b>moi</b>: Donne-<b>moi</b> ! Prends-<b>le</b> ! Vas-<b>y</b> ! Manges-<b>en</b> !<br>Phủ định: đại từ trước động từ: Ne <b>le</b> prends pas !",[
  F("Le livre ? ___ ! (prendre, tu)",["Prends-le","Le prends","Prends-lui","Prenez-le"]),
  F("___ le sel, s'il te plaît ! (passer, tu, à moi)",["Passe-moi","Passe-me","Me passe","Passes-moi"]),
  F("À la plage ? Oui, ___ ! (aller, tu)",["vas-y","va-y","y va","allez-y"]),
  F("Ta sœur ? Ne ___ dis rien !",["lui","la","le","elle"]),
  F("Des fruits ? ___ ! (manger, tu)",["Manges-en","Mange-en","En mange","Mange-les"]),
  M("Phủ định của « Appelle-la ! »",["Ne l'appelle pas !","N'appelle-la pas !","Ne appelle la pas !","Appelle-la pas !"])])
]),
UNIT("Les pronoms relatifs","Nối câu phức",[
 SEC("qui, que và où","<b>qui</b>: chủ ngữ · <b>que</b>: bổ ngữ · <b>où</b>: nơi chốn hoặc thời gian (le jour <b>où</b> je suis arrivé).",[
  F("La ville ___ je suis né est petite.",["où","que","qui","dont"]),

  F("C'est un film ___ fait rire.",["qui","que","où","dont"]),
  F("Le pays ___ je rêve d'aller, c'est le Japon.",["où","que","qui","dont"]),

 SEC("Đại từ quan hệ dont","<b>dont</b> thay cho bổ ngữ có <b>de</b>: parler de, avoir besoin de, être fier de, sở hữu (un ami dont le père…).",[
  F("Voici le livre ___ je t'ai parlé.",["dont","que","où","qui"],"parler de → dont."),
  F("C'est l'outil ___ j'ai besoin.",["dont","que","où","qui"]),

  F("Le film ___ tout le monde parle est sorti hier.",["dont","que","qui","où"]),
  M("Nối câu: « J'ai acheté une voiture. Je suis content de cette voiture. »",["J'ai acheté une voiture dont je suis content.","J'ai acheté une voiture que je suis content.","J'ai acheté une voiture où je suis content.","J'ai acheté une voiture qui je suis content."])])
]),
UNIT("La cause et la conséquence","Giải thích lý do, nêu hệ quả",[
 SEC("Nguyên nhân","<b>parce que</b> (vì, trả lời pourquoi) · <b>comme</b> (vì, đầu câu) · <b>puisque</b> (vì, lý do đã biết) · <b>à cause de</b> (tiêu cực) / <b>grâce à</b> (tích cực) + danh từ · <b>car</b> (văn viết).",[
  F("Je suis en retard ___ le métro est en panne.",["parce que","à cause du","grâce à","donc"]),
  F("___ il pleuvait, nous sommes restés à la maison.",["Comme","Parce que","Grâce à","Donc"],"Comme đứng đầu câu."),
  F("J'ai réussi ___ tes conseils.",["grâce à","à cause de","parce que","car"]),
  F("Le vol est annulé ___ la tempête.",["à cause de","grâce à","parce que","puisque"]),
  F("___ tu es là, aide-moi !",["Puisque","À cause","Grâce à","Donc"]),
  M("« car » thường dùng ở đâu?",["Văn viết, giữa câu","Đầu câu","Sau dấu chấm hỏi","Trong câu hỏi"])]),
 SEC("Hệ quả","<b>donc</b>, <b>alors</b>, <b>c'est pourquoi</b>, <b>par conséquent</b> · <b>si / tellement</b> + tính từ + <b>que</b> · <b>tellement de / tant de</b> + danh từ + que.",[
  F("Il fait froid, ___ je mets un manteau.",["donc","parce que","comme","car"]),
  F("Il était ___ fatigué qu'il s'est endormi.",["si","tant","tellement de","autant"]),
  F("Il y avait ___ monde que nous sommes partis.",["tellement de","si","tellement","très"]),
  F("J'ai raté le bus, ___ je suis arrivé en retard.",["c'est pourquoi","puisque","car","comme"]),
  M("Từ nào chỉ HỆ QUẢ?",["par conséquent","puisque","grâce à","comme"]),
  T("Trời mưa, vì vậy tôi ở nhà.",["Il pleut, donc je reste à la maison","Il pleut, alors je reste à la maison","Il pleut, c'est pourquoi je reste à la maison"])])
]),
UNIT("Le subjonctif présent","Bày tỏ mong muốn, nghĩa vụ, cảm xúc",[
 SEC("Cách chia subjonctif hiện tại","Gốc của <b>ils</b> ở hiện tại + <b>-e, -es, -e, -ions, -iez, -ent</b> (ils finissent → que je finisse).<br>Bất quy tắc: être (que je sois), avoir (que j'aie), aller (que j'aille), faire (que je fasse), pouvoir (que je puisse), savoir (que je sache), vouloir (que je veuille).",[
  ...genConj("a2-15a",["parler","finir","prendre","venir","faire","aller","être","avoir","pouvoir","savoir","boire","vouloir"],"subj",16)]),
 SEC("Khi nào dùng subjonctif","Sau: <b>il faut que</b>, <b>vouloir que</b>, <b>souhaiter que</b>, <b>aimer que</b>, cảm xúc (<b>être content / triste que</b>), <b>avant que, pour que, bien que</b>.<br>Cùng chủ ngữ → dùng nguyên mẫu: Je veux <b>partir</b> (không: je veux que je parte).",[
  F("Je veux que tu ___ avec moi.",["viennes","viens","viendras","venais"]),
  F("Il faut que nous ___ à l'heure.",["soyons","sommes","serons","étions"]),
  F("Je suis content que vous ___ là.",["soyez","êtes","serez","étiez"]),
  F("Mes parents souhaitent que je ___ mes études.",["finisse","finis","finirai","finissais"]),
  F("Je pense qu'il ___ raison.",["a","ait","aura eu","avoir"],"penser que (khẳng định) + indicatif."),
  F("Parle plus fort pour qu'on t'___ !",["entende","entend","entendra","entendait"]),
  M("Câu nào đúng?",["Je veux partir.","Je veux que je parte.","Je veux que je pars.","Je veux je parte."],"Cùng chủ ngữ → nguyên mẫu."),
  T("Bạn phải đến.",["Il faut que tu viennes","Il faut que vous veniez"])])
])
]};
